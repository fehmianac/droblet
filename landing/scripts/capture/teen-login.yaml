# Signs in to the showcase build as EMAIL (mock-auth.mjs picks the teen persona from it) and waits for the app.
appId: com.alatech.droplet
env:
  EMAIL: ${EMAIL}
---
- extendedWaitUntil:
    visible:
      id: "welcome.login"
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: "animated-splash"
    timeout: 10000
- tapOn:
    id: "welcome.login"
- extendedWaitUntil:
    visible:
      id: "auth.email"
    timeout: 10000
- tapOn:
    id: "auth.email"
- inputText: ${EMAIL}
- tapOn:
    point: "50%,14%"
- tapOn:
    id: "auth.password"
- inputText: "showcase"
- tapOn:
    point: "50%,14%"
- tapOn:
    id: "auth.submit"
- extendedWaitUntil:
    visible: "Sonra"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: "Sonra"
    commands:
      - tapOn: "Sonra"
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: "tab.today"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
