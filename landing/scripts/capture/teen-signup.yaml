# Teen sign-up screenshots (canvas 18): 02 with the birth year, the year sheet, 02g (under 16), 02h, 02i, 02j.
# A new account on the local mock (register with a 16–17 year = teen without a parent e-mail). No e-mail is sent, no AI.
#   maestro --device <udid> test -e LANG=tr -e LOCALE=tr_TR --test-output-dir=/abs/dir landing/scripts/capture/teen-signup.yaml
appId: com.alatech.droplet
env:
  LANG: ${LANG}
  LOCALE: ${LOCALE}
---
- launchApp:
    clearState: true
    clearKeychain: true
    arguments:
      AppleLanguages: "(${LANG})"
      AppleLocale: ${LOCALE}
- extendedWaitUntil:
    visible:
      id: "welcome.start"
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: "animated-splash"
    timeout: 10000
- tapOn:
    id: "welcome.start"
- extendedWaitUntil:
    visible:
      id: "auth.name"
    timeout: 10000
- tapOn:
    id: "auth.name"
- inputText: "Ece"
- tapOn:
    point: "50%,14%"
- tapOn:
    id: "auth.email"
- inputText: "ece.yeni@example.com"
- tapOn:
    point: "50%,14%"
- tapOn:
    id: "auth.password"
- inputText: "showcase1"
- tapOn:
    point: "50%,14%"
- scrollUntilVisible:
    element:
      id: "birth.year"
    direction: DOWN
- takeScreenshot: teen-02-kayit-bos
- tapOn:
    id: "birth.year"
- extendedWaitUntil:
    visible:
      id: "birth.yearSheet.list"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: teen-02f-yil-secici
- tapOn:
    id: "birth.yearSheet.option.2013"
- tapOn:
    id: "birth.yearSheet.select"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "auth.submit"
    direction: DOWN
- tapOn:
    id: "auth.submit"
- extendedWaitUntil:
    visible:
      id: "teen.under.email"
    timeout: 5000
- takeScreenshot: teen-02g-16-alti
- tapOn:
    id: "teen.under.fix"
- extendedWaitUntil:
    visible:
      id: "birth.year"
    timeout: 5000
- runFlow:
    file: pick-year.yaml
    env:
      YEAR: "2009"
- scrollUntilVisible:
    element:
      id: "birth.hint"
    direction: DOWN
- takeScreenshot: teen-02-kayit-genc
- scrollUntilVisible:
    element:
      id: "auth.submit"
    direction: DOWN
- tapOn:
    id: "auth.submit"
- extendedWaitUntil:
    visible:
      id: "teen.intro"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: teen-02h-aciklama
- tapOn:
    id: "teen.intro.continue"
- extendedWaitUntil:
    visible: "Sonra"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: "Sonra"
    commands:
      - tapOn: "Sonra"
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: "teen.parent"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: teen-02i-veli-eposta
- tapOn:
    id: "teen.parent.email"
- inputText: "ayse@ornek.com"
- tapOn:
    point: "50%,14%"
- tapOn:
    id: "teen.parent.send"
- extendedWaitUntil:
    visible:
      id: "teen.waiting"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: teen-02j-bekleniyor
