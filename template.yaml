AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Droblet backend: Api (HTTP API), AI workers (ItemProcessor, OutfitImport, Stylist, TryOn, Palette; SQS + DLQ), Notifier
  (EventBridge Scheduler), one DynamoDB table, private photo bucket. Region eu-central-1.
  Secrets are never template values. Fixed non-secret config is created here as SSM String parameters
  (name = config section, value = JSON). deploy-infra creates the rest once and never overwrites it:
  SecureString api/Jwt, api/AdminJwt, api/Email/SendGrid/ApiKey, api/AppleAuth/PrivateKey, api/Store/IapPrivateKey,
  api/Store/GooglePlayServiceAccountJson, worker/Ai/ApiKey, notifier/Push/ServiceAccountJson,
  notifier/Push/ApnsKey; String api/Email, api/GoogleAuth, api/AppleAuth, api/Store/IapKeyId,
  worker/Ai (full list: docs/store-setup.md). A secret still set to CHANGE_ME counts as not configured. SecureString api/AffiliatePostback
  is created by hand. E-mail (SendGrid), weather, FCM and OpenAI are HTTPS calls: no SES resource.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Suffix of every resource name (droblet-{Stage}-...).
  DeploymentBucket:
    Type: String
    Description: S3 bucket holding the Lambda zip used when a function is first created.
  DeploymentKey:
    Type: String
    Default: deploy.zip
    Description: Object key of that zip. Later code updates go through deploy-lambdas, not this template.
  AlarmEmail:
    Type: String
    Default: ''
    Description: Optional e-mail subscribed to the alarm topic (the address must confirm the subscription).
  ItemProcessorMaxConcurrency:
    Type: Number
    Default: 5
    MinValue: 2
    Description: SQS MaximumConcurrency — bulk add peak vs. provider rate limit. Re-measure after A-3.
  StylistMaxConcurrency:
    Type: Number
    Default: 5
    MinValue: 2
  TryOnMaxConcurrency:
    Type: Number
    Default: 4
    MinValue: 2
    Description: >-
      Tightest limit — the most expensive call (image generation). Concurrency does not change the number of calls (cost),
      only how many run at once: a week try-on (7 images, ~25 s each) finishes in 2 waves (~50 s) at 4 instead of 4 waves
      (~100 s) at 2. Keep below the image model's rate limit.
  PaletteMaxConcurrency:
    Type: Number
    Default: 2
    MinValue: 2
  OutfitImportMaxConcurrency:
    Type: Number
    Default: 3
    MinValue: 2
    Description: >-
      SQS MaximumConcurrency of the outfit import worker (all tenants). Each tenant is also capped inside the job
      (OutfitImport:MaxInFlightPerTenant, default 3), so one 30-photo import never takes every slot.
  LogRetentionDays:
    Type: Number
    Default: 0
    AllowedValues: [0, 1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: CloudWatch Logs retention (days) of every Lambda log group. 0 = the stage default, 90 days on dev and 400 on prod.

Conditions:
  IsProd: !Equals [!Ref Stage, prod]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]
  HasLogRetentionOverride: !Not [!Equals [!Ref LogRetentionDays, '0']]

Globals:
  Function:
    Runtime: dotnet10
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 30
    Tracing: Active
    CodeUri:
      Bucket: !Ref DeploymentBucket
      Key: !Ref DeploymentKey
    Environment:
      Variables:
        STAGE: !Ref Stage
        TABLE_NAME: !Ref DrobletTable
    Tags:
      project: droblet
      stage: !Ref Stage

Resources:
  # ── DynamoDB ──────────────────────────────────────────────────────────────
  DrobletTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub droblet-${Stage}-table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
        # Must match the "deleted from backups within N days" promise of account deletion.
        RecoveryPeriodInDays: !If [IsProd, 30, !Ref AWS::NoValue]
      Tags:
        - { Key: project, Value: droblet }
        - { Key: stage, Value: !Ref Stage }

  # ── S3: photo bucket — private (presigned URLs) except public/{Stage}/items/ (docs/images.md) ──
  # Owner decision 2026-11-20: one bucket. Only cleaned wardrobe piece images (background removed, no person in them) and
  # their 256 / 768 px thumbnails are copied to public/{Stage}/items/{tenantHash}/{itemId}-{random128}-{size}.webp and
  # read through Cloudflare (cdn.alatech.co; the stage in the key lets one hostname route to both stages' buckets). Originals, look covers, body / face photos, try-ons, avatars and
  # exports stay private. The bucket policy below is the only public grant.
  PhotoBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub droblet-${Stage}-photos
      # ACLs stay blocked (BucketOwnerEnforced too); the policy-level blocks are off only so that the single
      # PublicItemImagesFromCloudflare statement can take effect. TemplateConfigTests pins that statement's scope.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Versioning stays OFF: a kept old version would break the "delete my photos" promise.
      LifecycleConfiguration:
        Rules:
          - Id: expire-temp-uploads
            Status: Enabled
            Prefix: uploads/tmp/
            ExpirationInDays: 1
          # "Kombinlerini içe aktar" originals: the worker keeps a stripped copy; unfinished sessions expire after 7 days too.
          - Id: expire-outfit-import-uploads
            Status: Enabled
            Prefix: uploads/import/
            ExpirationInDays: 7
          # "Verilerimi indir" ZIPs: the e-mailed link promises 7 days.
          - Id: expire-data-exports
            Status: Enabled
            Prefix: exports/
            ExpirationInDays: 7
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [POST, GET]
            AllowedOrigins: ['*']
            AllowedHeaders: ['*']
            MaxAge: 3000
      Tags:
        - { Key: project, Value: droblet }
        - { Key: stage, Value: !Ref Stage }

  PhotoBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PhotoBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt PhotoBucket.Arn
              - !Sub '${PhotoBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
          # Anonymous GetObject on exactly public/{Stage}/items/* (no ListBucket, no other prefix), and only from Cloudflare's
          # IPv4 ranges: the DNS record cdn.alatech.co is proxied and its origin (for /public/{Stage}/) is this bucket's REST endpoint.
          - Sid: PublicItemImagesFromCloudflare
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${PhotoBucket.Arn}/public/${Stage}/items/*'
            Condition:
              IpAddress:
                # https://www.cloudflare.com/ips-v4 — same list as infra/landing.yaml; update both when it changes.
                aws:SourceIp:
                    - 173.245.48.0/20
                    - 103.21.244.0/22
                    - 103.22.200.0/22
                    - 103.31.4.0/22
                    - 141.101.64.0/18
                    - 108.162.192.0/18
                    - 190.93.240.0/20
                    - 188.114.96.0/20
                    - 197.234.240.0/22
                    - 198.41.128.0/17
                    - 162.158.0.0/15
                    - 104.16.0.0/13
                    - 104.24.0.0/14
                    - 172.64.0.0/13
                    - 131.0.72.0/22

  # ── S3: public catalog images (product / brand / edit / collection / library images from the admin panel) ──
  # Not user data. Objects under catalog/ are publicly readable over https (the app and the try-on worker fetch
  # them); writes only through presigned POSTs that the Api issues to signed-in admins.
  CatalogImageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub droblet-${Stage}-catalog-images
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [POST]
            AllowedOrigins: !If
              - IsProd
              - ['https://droblet-admin.alatech.co']
              - ['https://droblet-admin.alatech.co', 'http://localhost:3000']
            AllowedHeaders: ['*']
            MaxAge: 3000
          - AllowedMethods: [GET, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3000
      Tags:
        - { Key: project, Value: droblet }
        - { Key: stage, Value: !Ref Stage }

  CatalogImageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CatalogImageBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadCatalogImages
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${CatalogImageBucket.Arn}/catalog/*'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt CatalogImageBucket.Arn
              - !Sub '${CatalogImageBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # ── SQS: request queues + DLQs (maxReceiveCount 3: an AI call is billed per attempt) ──
  ItemProcessorRequestDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub droblet-${Stage}-item-process-request-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  ItemProcessorRequestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub droblet-${Stage}-item-process-request
      VisibilityTimeout: 150
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ItemProcessorRequestDlq.Arn
        maxReceiveCount: 3

  StylistRequestDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub droblet-${Stage}-stylist-request-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  StylistRequestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub droblet-${Stage}-stylist-request
      VisibilityTimeout: 150
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt StylistRequestDlq.Arn
        maxReceiveCount: 3

  TryOnRequestDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub droblet-${Stage}-tryon-request-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  TryOnRequestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub droblet-${Stage}-tryon-request
      VisibilityTimeout: 150
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TryOnRequestDlq.Arn
        maxReceiveCount: 3

  PaletteRequestDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub droblet-${Stage}-palette-request-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  PaletteRequestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub droblet-${Stage}-palette-request
      VisibilityTimeout: 150
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PaletteRequestDlq.Arn
        maxReceiveCount: 3

  # "Kombinlerini içe aktar": one message per photo. The worker itself re-sends a photo with a delay (tenant at its cap,
  # session busy, OpenAI rate limit), so maxReceiveCount only counts real failures.
  OutfitImportRequestDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub droblet-${Stage}-outfit-import-request-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  OutfitImportRequestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub droblet-${Stage}-outfit-import-request
      VisibilityTimeout: 150
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OutfitImportRequestDlq.Arn
        maxReceiveCount: 3

  # "Verilerimi indir": not an AI call, so a retry is cheap; the visibility outlasts the 10-minute function.
  DataExportRequestDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub droblet-${Stage}-data-export-request-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  DataExportRequestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub droblet-${Stage}-data-export-request
      VisibilityTimeout: 900
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DataExportRequestDlq.Arn
        maxReceiveCount: 3

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub droblet-${Stage}-alarms
  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # ── SSM (non-secret config; String). Parameter name = config section, value = JSON ──
  SsmApiEntitlements:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/api/Entitlements
      Type: String
      Description: Premium try-on credits per month; Free.ItemRecognitionLimit = lifetime AI garment recognitions of a non-member (0 = members only); OutfitImportMaxPhotos = photos per outfit import, per plan; SelfServePremium.Enabled = temporary self-serve premium (on in dev, off in prod).
      Value: !If
        - IsProd
        - '{"Premium":{"TryOnCreditsPerMonth":30,"OutfitImportMaxPhotos":30},"Free":{"ItemRecognitionLimit":10,"OutfitImportMaxPhotos":30},"SelfServePremium":{"Enabled":false}}'
        - '{"Premium":{"TryOnCreditsPerMonth":30,"OutfitImportMaxPhotos":30},"Free":{"ItemRecognitionLimit":10,"OutfitImportMaxPhotos":30},"SelfServePremium":{"Enabled":true}}'
  SsmApiAiLimits:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/api/AiLimits
      Type: String
      Description: Per-tenant caps of AI work without credits (stylist jobs, garment recognitions, palette per UTC day; any AI start per minute); 0 = no cap. 429 ai_limit_reached. On in dev; prod stays off until the owner decides (docs/ai-cost.md).
      Value: !If
        - IsProd
        - '{"StylistJobsPerDay":0,"ItemRecognitionsPerDay":0,"PaletteAnalysesPerDay":0,"AiStartsPerMinute":0}'
        - '{"StylistJobsPerDay":40,"ItemRecognitionsPerDay":150,"PaletteAnalysesPerDay":5,"AiStartsPerMinute":20}'
  SsmApiAiUsage:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/api/AiUsage
      Type: String
      Description: Admin AI cost board (AI › Maliyet) - USD/TRY rate for TRY columns, net TRY per month of the monthly and yearly plan (docs/ai-cost.md §7), anomaly thresholds (X times the user's 30-day median, absolute USD per day), top users, max range in days.
      Value: '{"UsdTryRate":43,"NetMonthlyPlanTry":141.66,"NetYearlyPlanPerMonthTry":88.54,"AnomalyMedianMultiplier":5,"AnomalyMinHistoryDays":3,"AnomalyMinDayUsd":0.10,"AnomalyAbsoluteDayUsd":2,"TopUsers":20,"MaxRangeDays":92}'
  SsmApiPhotos:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/api/Photos
      Type: String
      Description: ReadUrlTtlSeconds = presigned GETs of private images (the app caches by a stable key and refreshes on error). PublicBaseUrl = CDN of cleaned item images (owner decision, both stages); used only once api/Photos/PublicUrlsEnabled (deploy-infra, default false) is true.
      Value: '{"UploadUrlTtlSeconds":300,"ReadUrlTtlSeconds":3600,"PublicBaseUrl":"https://cdn.alatech.co","MaxUploadBytes":10485760,"AllowedContentTypes":["image/jpeg","image/png"]}'
  SsmApiApp:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/api/App
      Type: String
      Value: '{"PasswordResetUrl":"https://droblet.alatech.co/reset-password/","EmailVerificationUrl":"https://droblet.alatech.co/verify-email/","Scheme":"droplet","BundleId":"com.alatech.droplet"}'
  SsmApiStore:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/api/Store
      Type: String
      Description: Store product ids (representative until the store products exist) and credits per consumable pack.
      Value: '{"ProductIds":{"Premium":["com.alatech.droplet.premium.monthly","com.alatech.droplet.premium.yearly"]},"CreditPacks":{"com.alatech.droplet.credits.20":20}}'
  SsmApiAuthRateLimits:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/api/AuthRateLimits
      Type: String
      Description: Sign-in abuse limits. dev is looser so automated UI tests from one IP are not locked out.
      Value: !If
        - IsProd
        - '{"LoginPerEmailPer15Minutes":10,"LoginPerIpPer15Minutes":50,"RegisterPerIpPerHour":20,"ForgotPerEmailPerHour":3}'
        - '{"LoginPerEmailPer15Minutes":50,"LoginPerIpPer15Minutes":500,"RegisterPerIpPerHour":500,"ForgotPerEmailPerHour":20}'
  SsmWorkerEntitlements:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/worker/Entitlements
      Type: String
      Description: Same values as api/Entitlements (workers commit / release credits and the recognition allowance).
      Value: !If
        - IsProd
        - '{"Premium":{"TryOnCreditsPerMonth":30,"OutfitImportMaxPhotos":30},"Free":{"ItemRecognitionLimit":10,"OutfitImportMaxPhotos":30},"SelfServePremium":{"Enabled":false}}'
        - '{"Premium":{"TryOnCreditsPerMonth":30,"OutfitImportMaxPhotos":30},"Free":{"ItemRecognitionLimit":10,"OutfitImportMaxPhotos":30},"SelfServePremium":{"Enabled":true}}'
  SsmNotifierNotifications:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/notifier/Notifications
      Type: String
      Value: '{"DefaultMorningLocal":"07:30","DefaultWeeklyEditLocal":"Mon 09:00","DefaultFriendRatingsLocal":"19:00"}'
  SsmApiLocalization:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/api/Localization
      Type: String
      Description: Supported languages and the default one. Adding a language is this list plus data (no code).
      Value: '{"SupportedLanguages":["tr","en"],"DefaultLanguage":"tr"}'
  SsmApiAdminAuth:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/api/AdminAuth
      Type: String
      Description: Admin panel sign-in (code TTL, tries, rate limits), CORS origins of v1/admin, first super admin (created without a password).
      Value: !If
        - IsProd
        - '{"PanelUrl":"https://droblet-admin.alatech.co","AllowedOrigins":["https://droblet-admin.alatech.co"],"BootstrapSuperAdminEmail":"fehmianac@gmail.com","CodeTtlMinutes":10,"CodeMaxAttempts":5,"LoginPerEmailPer15Minutes":10,"LoginPerIpPer15Minutes":50,"VerifyPerIpPer15Minutes":50,"ForgotPerEmailPerHour":3,"RequestsPerMinute":600}'
        - '{"PanelUrl":"https://droblet-admin.alatech.co","AllowedOrigins":["https://droblet-admin.alatech.co","http://localhost:3000"],"BootstrapSuperAdminEmail":"fehmianac@gmail.com","CodeTtlMinutes":10,"CodeMaxAttempts":5,"LoginPerEmailPer15Minutes":10,"LoginPerIpPer15Minutes":50,"VerifyPerIpPer15Minutes":50,"ForgotPerEmailPerHour":3,"RequestsPerMinute":600}'
  SsmApiWardrobe:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/api/Wardrobe
      Type: String
      Description: Bulk upload and split limits, public asset base URL, category to outfit-slot mapping.
      Value: '{"MaxBatchUpload":30,"MaxSplitPieces":6,"PublicAssetBaseUrl":"","SlotMapping":{"Beachwear":["Top","Bottom"],"Skiwear":["Top","Bottom","Outerwear"]}}'
  SsmApiWeather:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/api/Weather
      Type: String
      Description: Open-Meteo (keyless) forecast and geocoding endpoints, cache minutes.
      Value: '{"Provider":"OpenMeteo","CacheMinutes":60,"ForecastBaseUrl":"https://api.open-meteo.com","GeocodingBaseUrl":"https://geocoding-api.open-meteo.com","TimeoutSeconds":5}'
  SsmApiStylist:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/api/Stylist
      Type: String
      Description: Stylist limits and temperature thresholds. dev - WeekBatchDays 0 (the week in one call - about 35% cheaper, no repeated looks; docs/ai-cost.md); prod keeps the default 3.
      Value: !If
        - IsProd
        - '{"SuggestionCount":3,"MaxCandidates":60,"MaxTitleLength":40,"MaxExplanationLength":280,"FreeTextMaxLength":200,"HotFromC":26,"ColdBelowC":12,"DislikeMemory":10}'
        - '{"SuggestionCount":3,"MaxCandidates":60,"MaxTitleLength":40,"MaxExplanationLength":280,"FreeTextMaxLength":200,"HotFromC":26,"ColdBelowC":12,"DislikeMemory":10,"WeekBatchDays":0}'
  SsmApiPacking:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/api/Packing
      Type: String
      Description: CabinMaxItems = piece limit of a cabin-only trip (0 = not enforced); MaxTripDays.
      Value: '{"CabinMaxItems":12,"MaxTripDays":21}'
  SsmApiPalette:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/api/Palette
      Type: String
      Description: Palette compatibility rule. Empty NeutralColorIds = every colour outside the season lists is neutral.
      Value: '{"NeutralsCountAsCompatible":true,"NeutralColorIds":[]}'
  SsmApiCatalog:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/api/Catalog
      Type: String
      Description: Catalog paging, cache and cart limits. ImageHosts = hosts product images may be fetched from (empty = any https host). WatchAutoAddHours = brand click without conversion goes on the watch list (0 = off).
      Value: '{"PageSize":24,"MaxPageSize":60,"CacheSeconds":60,"MaxCartLines":100,"MaxWatchItems":200,"BulkUpsertMax":200,"ImageHosts":[],"MaxImageBytes":10485760,"WatchAutoAddHours":48}'
  SsmApiSocial:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/api/Social
      Type: String
      Description: Social limits and the invite link base URL.
      Value: '{"MaxFollowing":500,"FeedPageSize":20,"SuggestedPageSize":20,"SuggestedCandidateLimit":100,"SearchPageSize":20,"InviteUrl":"https://droblet.alatech.co/invite","InviteAttributionWindowDays":30,"ReportsPerDay":20,"InviteResolvePerIpPerHour":60,"ContactMatchesPerDay":10,"ContactMatchMaxHashes":1000}'
  SsmApiAffiliate:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/api/Affiliate
      Type: String
      Description: Default affiliate commission in basis points (per-brand overrides live on the brand record).
      Value: '{"DefaultCommissionRateBps":0}'
  SsmApiNotifications:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/api/Notifications
      Type: String
      Description: Defaults of a new notification preference and the device limit.
      Value: '{"DefaultMorningLocal":"07:30","DefaultTimeZone":"Europe/Istanbul","MaxDevicesPerTenant":10}'
  SsmWorkerLocalization:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/worker/Localization
      Type: String
      Description: Same list as api/Localization (language of AI text).
      Value: '{"SupportedLanguages":["tr","en"],"DefaultLanguage":"tr"}'
  SsmWorkerWardrobe:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/worker/Wardrobe
      Type: String
      Description: Same values as api/Wardrobe (split limit, slot mapping used by the worker guards).
      Value: '{"MaxBatchUpload":30,"MaxSplitPieces":6,"PublicAssetBaseUrl":"","SlotMapping":{"Beachwear":["Top","Bottom"],"Skiwear":["Top","Bottom","Outerwear"]}}'
  SsmWorkerWeather:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/worker/Weather
      Type: String
      Description: Same values as api/Weather (stylist and suitcase jobs read the forecast).
      Value: '{"Provider":"OpenMeteo","CacheMinutes":60,"ForecastBaseUrl":"https://api.open-meteo.com","GeocodingBaseUrl":"https://geocoding-api.open-meteo.com","TimeoutSeconds":5}'
  SsmWorkerStylist:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/worker/Stylist
      Type: String
      Description: Same values as api/Stylist.
      Value: !If
        - IsProd
        - '{"SuggestionCount":3,"MaxCandidates":60,"MaxTitleLength":40,"MaxExplanationLength":280,"FreeTextMaxLength":200,"HotFromC":26,"ColdBelowC":12,"DislikeMemory":10}'
        - '{"SuggestionCount":3,"MaxCandidates":60,"MaxTitleLength":40,"MaxExplanationLength":280,"FreeTextMaxLength":200,"HotFromC":26,"ColdBelowC":12,"DislikeMemory":10,"WeekBatchDays":0}'
  SsmWorkerPacking:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/worker/Packing
      Type: String
      Description: Same values as api/Packing (the suitcase job enforces the cabin limit).
      Value: '{"CabinMaxItems":12,"MaxTripDays":21}'
  SsmWorkerCatalog:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/worker/Catalog
      Type: String
      Description: Same values as api/Catalog (the try-on job downloads product images).
      Value: '{"PageSize":24,"MaxPageSize":60,"CacheSeconds":60,"MaxCartLines":100,"MaxWatchItems":200,"BulkUpsertMax":200,"ImageHosts":[],"MaxImageBytes":10485760,"WatchAutoAddHours":48}'
  SsmWorkerAiPricing:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/worker/Ai/Pricing
      Type: String
      Description: AI cost accounting only (never changes a request) - USD per 1M tokens per model (OpenAI standard rates 2026-11, docs/ai-cost.md), tier multipliers, per-image fallback and USD/TRY (assumptions).
      Value: '{"Models":{"gpt-6-astra":{"Input":10,"CachedInput":1.0,"Output":50},"gpt-6.2-astra":{"Input":8,"CachedInput":0.4,"Output":40},"gpt-6.2-sol":{"Input":2,"CachedInput":0.1,"Output":10},"gpt-6.1-sol":{"Input":2,"CachedInput":0.1,"Output":10},"gpt-6.1-terra":{"Input":1,"CachedInput":0.05,"Output":5},"gpt-6-sol":{"Input":2,"CachedInput":0.2,"Output":10},"gpt-6-luna":{"Input":0.1,"CachedInput":0.01,"Output":0.5},"gpt-5.6-sol":{"Input":4,"CachedInput":0.4,"Output":20},"gpt-5.6-terra":{"Input":2,"CachedInput":0.2,"Output":12},"gpt-5.6-luna":{"Input":0.2,"CachedInput":0.02,"Output":1.2},"gpt-5.4-mini":{"Input":0.75,"CachedInput":0.075,"Output":4.5},"gpt-5-mini":{"Input":0.25,"CachedInput":0.025,"Output":2},"gpt-5-nano":{"Input":0.05,"CachedInput":0.005,"Output":0.4},"gpt-image-2.5-sunburst":{"Input":5,"CachedInput":1.25,"ImageInput":8,"ImageCachedInput":2,"ImageOutput":30},"gpt-image-2.5-flare":{"Input":5,"CachedInput":1.25,"ImageInput":8,"ImageCachedInput":2,"ImageOutput":30},"gpt-image-2":{"Input":5,"CachedInput":1.25,"ImageInput":8,"ImageCachedInput":2,"ImageOutput":30},"gpt-image-1-mini":{"Input":2,"CachedInput":0.2,"ImageInput":2.5,"ImageCachedInput":0.25,"ImageOutput":8}},"TierMultipliers":{"flex":0.5,"batch":0.5,"priority":2,"fast":2},"ImageFallback":{"low/1024x1024":0.006,"medium/1024x1024":0.013,"high/1024x1024":0.053},"UsdTry":43}'
  SsmNotifierLocalization:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /droblet/${Stage}/notifier/Localization
      Type: String
      Description: Same list as api/Localization (language of push texts).
      Value: '{"SupportedLanguages":["tr","en"],"DefaultLanguage":"tr"}'

  # ── IAM: one role per Lambda ───────────────────────────────────────────────
  ApiLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub droblet-${Stage}-api-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: api
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !GetAtt DrobletTable.Arn
                  - !Sub '${DrobletTable.Arn}/index/*'
              - Effect: Allow
                Action: sqs:SendMessage
                Resource:
                  - !GetAtt ItemProcessorRequestQueue.Arn
                  - !GetAtt StylistRequestQueue.Arn
                  - !GetAtt TryOnRequestQueue.Arn
                  - !GetAtt PaletteRequestQueue.Arn
                  - !GetAtt DataExportRequestQueue.Arn
                  - !GetAtt OutfitImportRequestQueue.Arn
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/api
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/api/*
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource:
                  - !Sub '${PhotoBucket.Arn}/uploads/tmp/*'
                  - !Sub '${PhotoBucket.Arn}/uploads/import/*'
                  - !Sub '${PhotoBucket.Arn}/tenant/*'
                  # Public copies of cleaned piece images: publish (copy), presigned fallback, delete, account deletion.
                  - !Sub '${PhotoBucket.Arn}/public/${Stage}/items/*'
              # Data export ZIPs: presigned download (GetObject) and account deletion (DeleteObject); written by the worker.
              - Effect: Allow
                Action: [s3:GetObject, s3:DeleteObject]
                Resource: !Sub '${PhotoBucket.Arn}/exports/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt PhotoBucket.Arn
                Condition:
                  StringLike:
                    's3:prefix': ['uploads/tmp/*', 'uploads/import/*', 'tenant/*', 'exports/*', !Sub 'public/${Stage}/items/*']
              # Admin panel image uploads (presigned POST signed with this role).
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${CatalogImageBucket.Arn}/catalog/*'
              # Admin panel settings: read the editable worker / notifier values (api/* is readable above)…
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/worker/Entitlements
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/worker/Packing
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/worker/Ai
                  # AI → Modeller shows the cost price list read-only (a String parameter, no secret).
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/worker/Ai/Pricing
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/notifier/Notifications
              # …and write exactly the owner-editable, non-secret parameters (Domain SettingsCatalog). Nothing else.
              - Effect: Allow
                Action: ssm:PutParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/api/Entitlements
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/worker/Entitlements
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/api/Packing
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/worker/Packing
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/worker/Ai
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/api/Notifications
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/notifier/Notifications
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/api/AuthRateLimits
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/api/AiLimits

  ItemProcessorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub droblet-${Stage}-item-processor-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: item-processor
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # SendMessage: an admin "Bakım" publish-item-images run queues its next batch on this same queue.
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility, sqs:SendMessage]
                Resource: !GetAtt ItemProcessorRequestQueue.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query]
                Resource: !GetAtt DrobletTable.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${PhotoBucket.Arn}/uploads/tmp/*'
              - Effect: Allow
                # DeleteObject: images written for a draft the user deleted while it was being processed are removed again.
                # GetObject: the source of the public copy (CopyObject) of a cleaned image.
                Action: [s3:PutObject, s3:DeleteObject, s3:GetObject]
                Resource: !Sub '${PhotoBucket.Arn}/tenant/*/items/*'
              # Outfit-import pieces get their cleaned image here: it is published (copied) like the Api does on confirm.
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${PhotoBucket.Arn}/public/${Stage}/items/*'
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/worker
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/worker/*

  OutfitImportLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub droblet-${Stage}-outfit-import-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: outfit-import
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # SendMessage: a photo goes back on its own queue with a delay (tenant cap, session busy, rate-limit back-off).
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility, sqs:SendMessage]
                Resource: !GetAtt OutfitImportRequestQueue.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query]
                Resource: !GetAtt DrobletTable.Arn
              # Originals and wardrobe item images (match thumbnails) are read only; the session's own output is written.
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub '${PhotoBucket.Arn}/uploads/import/*'
                  - !Sub '${PhotoBucket.Arn}/tenant/*/items/*'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub '${PhotoBucket.Arn}/tenant/*/import/*'
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/worker
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/worker/*

  StylistLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub droblet-${Stage}-stylist-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: stylist
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
                Resource: !GetAtt StylistRequestQueue.Arn
              - Effect: Allow
                # BatchGetItem / BatchWriteItem: the shared weather forecast cache (stylist and suitcase jobs).
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:BatchGetItem, dynamodb:BatchWriteItem]
                Resource: !GetAtt DrobletTable.Arn
              # No S3: the stylist works on item attributes, never on photos.
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/worker
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/worker/*

  TryOnLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub droblet-${Stage}-tryon-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: tryon
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
                Resource: !GetAtt TryOnRequestQueue.Arn
              - Effect: Allow
                # TransactWriteItems for credit commit/refund (account + reservation + ledger).
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:ConditionCheckItem]
                Resource: !GetAtt DrobletTable.Arn
              - Effect: Allow
                Action: s3:GetObject
                # face/: the face path of "Üzerimde gör" (no body photo: face photo + body type).
                Resource:
                  - !Sub '${PhotoBucket.Arn}/tenant/*/body/*'
                  - !Sub '${PhotoBucket.Arn}/tenant/*/face/*'
                  - !Sub '${PhotoBucket.Arn}/tenant/*/items/*'
              - Effect: Allow
                # A photo rejected by the server-side photo check (not full body, too dark, …) is removed, not kept.
                Action: s3:DeleteObject
                Resource:
                  - !Sub '${PhotoBucket.Arn}/tenant/*/body/*'
                  - !Sub '${PhotoBucket.Arn}/tenant/*/face/*'
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${PhotoBucket.Arn}/tenant/*/tryon/*'
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/worker
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/worker/*

  PaletteLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub droblet-${Stage}-palette-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: palette
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
                Resource: !GetAtt PaletteRequestQueue.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query]
                Resource: !GetAtt DrobletTable.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${PhotoBucket.Arn}/tenant/*/face/*'
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/worker
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/worker/*

  NotifierLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub droblet-${Stage}-notifier-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: notifier
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query, dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem]
                Resource: !GetAtt DrobletTable.Arn
              # No S3: notifications never carry photos or try-on images.
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/notifier
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/notifier/*

  DataExportLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub droblet-${Stage}-data-export-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: data-export
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
                Resource: !GetAtt DataExportRequestQueue.Arn
              - Effect: Allow
                # Reads every partition of the tenant (incl. its per-actor analytics partition); writes the export row, its
                # download token and the inbox row (TransactWriteItems: PutItem + ConditionCheckItem).
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:ConditionCheckItem]
                Resource: !GetAtt DrobletTable.Arn
              # The user's own files go into the ZIP: read-only on tenant/, write only under exports/.
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${PhotoBucket.Arn}/tenant/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt PhotoBucket.Arn
                Condition:
                  StringLike:
                    's3:prefix': ['tenant/*']
              - Effect: Allow
                Action: [s3:PutObject, s3:AbortMultipartUpload]
                Resource: !Sub '${PhotoBucket.Arn}/exports/*'
              # Same configuration as the Api (Email for the link e-mail, App links).
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/api
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/droblet/${Stage}/api/*

  # ── API Gateway ───────────────────────────────────────────────────────────
  HttpApiGateway:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 200
        ThrottlingRateLimit: 100
      # No CorsConfiguration: CORS is answered by the Api (UseDrobletCors) so v1/admin/* can allow only the admin
      # panel origin while every other route keeps "*". Gateway CORS would override the Api's headers.
      Tags:
        project: droblet
        stage: !Ref Stage

  # ── Lambda log groups (retention) ─────────────────────────────────────────
  # Every function writes to an explicitly named group with a retention (LogRetentionDays; default 90 days dev,
  # 400 days prod) through its LoggingConfig. Why NEW names (/droblet/{Stage}/lambda/{fn}) instead of declaring
  # /aws/lambda/droblet-{Stage}-{fn}: Lambda already auto-created those groups on the existing stacks, and an
  # AWS::Logs::LogGroup with an existing name fails the stack update (AlreadyExists) — importing them would need a
  # separate resource-import change set. Pointing LoggingConfig at a new group is an in-place function update, so this
  # is safe on an existing stack. The old auto-created groups are left as they are (no retention, no new events):
  # after the switch, delete them by hand once their history is no longer needed
  #   aws logs delete-log-group --log-group-name /aws/lambda/droblet-<stage>-<fn>
  # (or give them a retention: aws logs put-retention-policy --retention-in-days 90 ...). Writing needs no new IAM:
  # AWSLambdaBasicExecutionRole (every Lambda role below) allows logs:CreateLogStream / PutLogEvents on any group.
  # tools/Ops `logs` reads the new group and the old one.

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /droblet/${Stage}/lambda/api
      RetentionInDays: !If [HasLogRetentionOverride, !Ref LogRetentionDays, !If [IsProd, 400, 90]]

  ItemProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /droblet/${Stage}/lambda/item-processor
      RetentionInDays: !If [HasLogRetentionOverride, !Ref LogRetentionDays, !If [IsProd, 400, 90]]

  OutfitImportLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /droblet/${Stage}/lambda/outfit-import
      RetentionInDays: !If [HasLogRetentionOverride, !Ref LogRetentionDays, !If [IsProd, 400, 90]]

  StylistLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /droblet/${Stage}/lambda/stylist
      RetentionInDays: !If [HasLogRetentionOverride, !Ref LogRetentionDays, !If [IsProd, 400, 90]]

  TryOnLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /droblet/${Stage}/lambda/tryon
      RetentionInDays: !If [HasLogRetentionOverride, !Ref LogRetentionDays, !If [IsProd, 400, 90]]

  PaletteLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /droblet/${Stage}/lambda/palette
      RetentionInDays: !If [HasLogRetentionOverride, !Ref LogRetentionDays, !If [IsProd, 400, 90]]

  NotifierReminderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /droblet/${Stage}/lambda/notifier-reminder
      RetentionInDays: !If [HasLogRetentionOverride, !Ref LogRetentionDays, !If [IsProd, 400, 90]]

  NotifierWeeklyEditLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /droblet/${Stage}/lambda/notifier-weekly-edit
      RetentionInDays: !If [HasLogRetentionOverride, !Ref LogRetentionDays, !If [IsProd, 400, 90]]

  NotifierFriendRatingsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /droblet/${Stage}/lambda/notifier-friend-ratings
      RetentionInDays: !If [HasLogRetentionOverride, !Ref LogRetentionDays, !If [IsProd, 400, 90]]

  NotifierLifecycleLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /droblet/${Stage}/lambda/notifier-lifecycle
      RetentionInDays: !If [HasLogRetentionOverride, !Ref LogRetentionDays, !If [IsProd, 400, 90]]

  NotifierDataExportLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /droblet/${Stage}/lambda/notifier-data-export
      RetentionInDays: !If [HasLogRetentionOverride, !Ref LogRetentionDays, !If [IsProd, 400, 90]]

  # ── Lambdas ───────────────────────────────────────────────────────────────
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub droblet-${Stage}-api
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Handler: Api
      Role: !GetAtt ApiLambdaRole.Arn
      MemorySize: 1024   # PBKDF2 (600k iterations) on sign-in is CPU bound
      Environment:
        Variables:
          ASPNETCORE_ENVIRONMENT: !If [IsProd, Production, Development]
          SYSTEMS_MANAGER_PATH: !Sub /droblet/${Stage}/api
          ITEM_PROCESSOR_REQUEST_QUEUE_URL: !Ref ItemProcessorRequestQueue
          STYLIST_REQUEST_QUEUE_URL: !Ref StylistRequestQueue
          TRYON_REQUEST_QUEUE_URL: !Ref TryOnRequestQueue
          PALETTE_REQUEST_QUEUE_URL: !Ref PaletteRequestQueue
          DATA_EXPORT_REQUEST_QUEUE_URL: !Ref DataExportRequestQueue
          OUTFIT_IMPORT_REQUEST_QUEUE_URL: !Ref OutfitImportRequestQueue
          PHOTO_BUCKET: !Ref PhotoBucket
          CATALOG_IMAGE_BUCKET: !Ref CatalogImageBucket
          CATALOG_IMAGE_BASE_URL: !Sub https://${CatalogImageBucket}.s3.${AWS::Region}.amazonaws.com
      Events:
        ProxyRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApiGateway
            Path: /{proxy+}
            Method: ANY
        RootRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApiGateway
            Path: /
            Method: ANY

  ItemProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub droblet-${Stage}-item-processor
      LoggingConfig:
        LogGroup: !Ref ItemProcessorLogGroup
      Handler: ItemProcessor::ItemProcessor.Entrypoint::FunctionHandler
      Role: !GetAtt ItemProcessorLambdaRole.Arn
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          SYSTEMS_MANAGER_PATH: !Sub /droblet/${Stage}/worker
          PHOTO_BUCKET: !Ref PhotoBucket
          # publish-item-images batches re-queue themselves (Maintenance:BatchSize / BatchSeconds keep each one < 120 s).
          ITEM_PROCESS_REQUEST_QUEUE_URL: !Ref ItemProcessorRequestQueue
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt ItemProcessorRequestQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: !Ref ItemProcessorMaxConcurrency

  # "Kombinlerini içe aktar": the ItemProcessor package (detection, crops), its own handler, role, queue and log group.
  OutfitImportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub droblet-${Stage}-outfit-import
      LoggingConfig:
        LogGroup: !Ref OutfitImportLogGroup
      Handler: ItemProcessor::ItemProcessor.OutfitImportEntrypoint::FunctionHandler
      Role: !GetAtt OutfitImportLambdaRole.Arn
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          SYSTEMS_MANAGER_PATH: !Sub /droblet/${Stage}/worker
          PHOTO_BUCKET: !Ref PhotoBucket
          OUTFIT_IMPORT_REQUEST_QUEUE_URL: !Ref OutfitImportRequestQueue
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt OutfitImportRequestQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: !Ref OutfitImportMaxConcurrency

  StylistFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub droblet-${Stage}-stylist
      LoggingConfig:
        LogGroup: !Ref StylistLogGroup
      Handler: Stylist::Stylist.Entrypoint::FunctionHandler
      Role: !GetAtt StylistLambdaRole.Arn
      Timeout: 120
      MemorySize: 1024   # CPU scales with memory: at 512 MB a cold start spent ~1.8 s in init + JIT before the model call
      Environment:
        Variables:
          SYSTEMS_MANAGER_PATH: !Sub /droblet/${Stage}/worker
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt StylistRequestQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: !Ref StylistMaxConcurrency

  TryOnFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub droblet-${Stage}-tryon
      LoggingConfig:
        LogGroup: !Ref TryOnLogGroup
      Handler: TryOn::TryOn.Entrypoint::FunctionHandler
      Role: !GetAtt TryOnLambdaRole.Arn
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          SYSTEMS_MANAGER_PATH: !Sub /droblet/${Stage}/worker
          PHOTO_BUCKET: !Ref PhotoBucket
          CATALOG_IMAGE_BASE_URL: !Sub https://${CatalogImageBucket}.s3.${AWS::Region}.amazonaws.com
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt TryOnRequestQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: !Ref TryOnMaxConcurrency

  PaletteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub droblet-${Stage}-palette
      LoggingConfig:
        LogGroup: !Ref PaletteLogGroup
      Handler: Palette::Palette.Entrypoint::FunctionHandler
      Role: !GetAtt PaletteLambdaRole.Arn
      Timeout: 120
      MemorySize: 1024   # same start-up cost as Stylist (cold init + JIT at 512 MB)
      Environment:
        Variables:
          SYSTEMS_MANAGER_PATH: !Sub /droblet/${Stage}/worker
          PHOTO_BUCKET: !Ref PhotoBucket
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt PaletteRequestQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: !Ref PaletteMaxConcurrency

  # Notifier: one zip, four functions (a Lambda has one handler). Schedules are UTC; Turkey is UTC+3.
  NotifierReminderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub droblet-${Stage}-notifier-reminder
      LoggingConfig:
        LogGroup: !Ref NotifierReminderLogGroup
      Handler: Notifier::Notifier.Entrypoint::Reminder
      Role: !GetAtt NotifierLambdaRole.Arn
      Timeout: 300
      Environment:
        Variables:
          SYSTEMS_MANAGER_PATH: !Sub /droblet/${Stage}/notifier
      Events:
        Every15Minutes:
          Type: ScheduleV2
          Properties:
            Name: !Sub droblet-${Stage}-notifier-reminder
            ScheduleExpression: cron(0/15 * * * ? *)

  NotifierWeeklyEditFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub droblet-${Stage}-notifier-weekly-edit
      LoggingConfig:
        LogGroup: !Ref NotifierWeeklyEditLogGroup
      Handler: Notifier::Notifier.Entrypoint::WeeklyEdit
      Role: !GetAtt NotifierLambdaRole.Arn
      Timeout: 300
      Environment:
        Variables:
          SYSTEMS_MANAGER_PATH: !Sub /droblet/${Stage}/notifier
      Events:
        MondayMorning:
          Type: ScheduleV2
          Properties:
            Name: !Sub droblet-${Stage}-notifier-weekly-edit
            ScheduleExpression: cron(0 6 ? * MON *)   # Mon 09:00 TR (proposal, owner confirms)

  NotifierFriendRatingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub droblet-${Stage}-notifier-friend-ratings
      LoggingConfig:
        LogGroup: !Ref NotifierFriendRatingsLogGroup
      Handler: Notifier::Notifier.Entrypoint::FriendRatings
      Role: !GetAtt NotifierLambdaRole.Arn
      Timeout: 300
      Environment:
        Variables:
          SYSTEMS_MANAGER_PATH: !Sub /droblet/${Stage}/notifier
      Events:
        DailyEvening:
          Type: ScheduleV2
          Properties:
            Name: !Sub droblet-${Stage}-notifier-friend-ratings
            ScheduleExpression: cron(0 16 * * ? *)   # 19:00 TR daily digest (proposal)

  NotifierLifecycleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub droblet-${Stage}-notifier-lifecycle
      LoggingConfig:
        LogGroup: !Ref NotifierLifecycleLogGroup
      Handler: Notifier::Notifier.Entrypoint::Lifecycle
      Role: !GetAtt NotifierLambdaRole.Arn
      Timeout: 300
      Environment:
        Variables:
          SYSTEMS_MANAGER_PATH: !Sub /droblet/${Stage}/notifier
      Events:
        Daily:
          Type: ScheduleV2
          Properties:
            Name: !Sub droblet-${Stage}-notifier-lifecycle
            ScheduleExpression: cron(0 3 * * ? *)

  # "Verilerimi indir": SQS data-export-request → the ZIP (Notifier zip, own role, reads the api config).
  NotifierDataExportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub droblet-${Stage}-notifier-data-export
      LoggingConfig:
        LogGroup: !Ref NotifierDataExportLogGroup
      Handler: Notifier::Notifier.Entrypoint::DataExport
      Role: !GetAtt DataExportLambdaRole.Arn
      Timeout: 600
      MemorySize: 1024
      EphemeralStorage:
        Size: 2048   # the ZIP is written to /tmp before the upload
      Environment:
        Variables:
          SYSTEMS_MANAGER_PATH: !Sub /droblet/${Stage}/api
          PHOTO_BUCKET: !Ref PhotoBucket
          PUBLIC_API_BASE_URL: !Sub https://${HttpApiGateway}.execute-api.${AWS::Region}.amazonaws.com
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt DataExportRequestQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: 2

  # ── Alarms (all to AlarmTopic) ─────────────────────────────────────────────
  ItemProcessorDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub droblet-${Stage}-item-processor-dlq
      AlarmDescription: A user is stuck on the item processing screen.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt ItemProcessorRequestDlq.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  OutfitImportDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub droblet-${Stage}-outfit-import-dlq
      AlarmDescription: An outfit import photo died; its session waits for a photo that will not finish (the recognition is released after 24 h).
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt OutfitImportRequestDlq.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  StylistDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub droblet-${Stage}-stylist-dlq
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt StylistRequestDlq.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  TryOnDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub droblet-${Stage}-tryon-dlq
      AlarmDescription: A try-on request died — the user may hold an unrefunded credit reservation.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt TryOnRequestDlq.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  PaletteDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub droblet-${Stage}-palette-dlq
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt PaletteRequestDlq.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  DataExportDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub droblet-${Stage}-data-export-dlq
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt DataExportRequestDlq.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  ReminderNotInvokedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub droblet-${Stage}-notifier-reminder-not-invoked
      AlarmDescription: The 15-minute reminder job silently stopped.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions: [{ Name: FunctionName, Value: !Ref NotifierReminderFunction }]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlarmTopic]
  LifecycleNotInvokedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub droblet-${Stage}-notifier-lifecycle-not-invoked
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions: [{ Name: FunctionName, Value: !Ref NotifierLifecycleFunction }]
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  ApiUrl:
    Description: HTTP API base URL (map api.droblet.alatech.co to it).
    Value: !Sub https://${HttpApiGateway}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Value: !Ref DrobletTable
  PhotoBucketName:
    Value: !Ref PhotoBucket
  PhotoBucketOriginHost:
    Description: Cloudflare origin of cdn.alatech.co for paths /public/{Stage}/* (origin rule with Host header + SNI override to this host, docs/images.md).
    Value: !Sub '${PhotoBucket}.s3.${AWS::Region}.amazonaws.com'
  CatalogImageBucketName:
    Value: !Ref CatalogImageBucket
  CatalogImageBaseUrl:
    Description: Public https base of admin-uploaded catalog images (always allowed by Catalog:ImageHosts).
    Value: !Sub https://${CatalogImageBucket}.s3.${AWS::Region}.amazonaws.com
  ItemProcessorRequestQueueUrl:
    Value: !Ref ItemProcessorRequestQueue
  StylistRequestQueueUrl:
    Value: !Ref StylistRequestQueue
  TryOnRequestQueueUrl:
    Value: !Ref TryOnRequestQueue
  PaletteRequestQueueUrl:
    Value: !Ref PaletteRequestQueue
  OutfitImportRequestQueueUrl:
    Value: !Ref OutfitImportRequestQueue
  AlarmTopicArn:
    Value: !Ref AlarmTopic
