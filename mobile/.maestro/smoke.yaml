# Smoke flow: fresh install -> register -> onboarding -> the five tabs, against the real API.
# Elements are addressed by testID (stable across languages and copy changes).
# Run: maestro test -e EMAIL="smoke+$(date +%s)@example.com" .maestro/smoke.yaml
#      (needs a Release/dev build installed on a booted simulator; every run needs a fresh e-mail)
appId: com.alatech.droplet
env:
  EMAIL: ${EMAIL}
---
- launchApp:
    clearState: true
    clearKeychain: true
    arguments:
      AppleLanguages: "(tr)"
      AppleLocale: "tr_TR"
- extendedWaitUntil:
    visible:
      id: "welcome.start"
    timeout: 20000
# The animated splash (2.6 s) lies over the first screen and takes the touches until it has faded.
- extendedWaitUntil:
    notVisible:
      id: "animated-splash"
    timeout: 10000
- takeScreenshot: 01-hos-geldin
- tapOn:
    id: "welcome.start"

# 02 Kayıt — e-mail sign-up
- extendedWaitUntil:
    visible:
      id: "auth.name"
    timeout: 10000
- takeScreenshot: 02-kayit
- tapOn:
    id: "auth.name"
- inputText: "Damla"
# The fields below sit under the keyboard: the keyboard's "next" key moves the focus (and the form
# scrolls with it), exactly as a user would do it; "go" on the password submits.
- pressKey: Enter
- inputText: ${EMAIL}
- pressKey: Enter
- waitForAnimationToEnd
- tapOn:
    id: "auth.password"
- inputText: "Sm0keTest2026"
# Close the keyboard by tapping a plain label (hideKeyboard is unreliable on iOS secure fields). A fixed
# point is not safe: on a 4.7" screen (iPhone SE) the focused form has scrolled and 12 % lands on Google.
- tapOn:
    text: "VEYA E-POSTA|OR EMAIL"
# 18+ confirmation is required on e-mail sign-up.
- scrollUntilVisible:
    element:
      id: "age.checkbox"
    direction: DOWN
- tapOn:
    id: "age.checkbox"
- takeScreenshot: 02b-kayit-dolu
- scrollUntilVisible:
    element:
      id: "auth.submit"
    direction: DOWN
- tapOn:
    id: "auth.submit"

# iOS offers to save the new password in the keychain (a system sheet over the app, hiding it from
# Maestro): wait for it briefly and decline it, in either system language.
- extendedWaitUntil:
    visible: "Not Now|Şimdi Değil"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: "Not Now|Şimdi Değil"
    commands:
      - tapOn: "Not Now|Şimdi Değil"

# 03 Stil profili — a new account always goes through onboarding
- extendedWaitUntil:
    visible:
      id: "style.continue"
    timeout: 20000
- takeScreenshot: 03-stil-profili
- tapOn:
    id: "style.tag.minimal"
- tapOn:
    id: "style.tag.classic"
- tapOn:
    id: "style.tag.street"
- scrollUntilVisible:
    element:
      id: "style.budget.mixed"
    direction: DOWN
- tapOn:
    id: "style.budget.mixed"
- tapOn:
    id: "style.continue"

# 03b Açık rızalar — every consent on one screen, each box unticked; "Tümünü kabul et" ticks and records all
- extendedWaitUntil:
    visible:
      id: "consents.acceptAll"
    timeout: 20000
- takeScreenshot: 03b-acik-rizalar
# All seven purposes are listed; the face try-on one (consent 7) is further down the list.
- scrollUntilVisible:
    element:
      id: "consent.check.facePhotoTryOn"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "consents.acceptAll"

# 04 Beden + fotoğraf — skipped (no camera on the simulator)
- extendedWaitUntil:
    visible:
      id: "body.skip"
    timeout: 20000
- takeScreenshot: 04-beden-foto
# 04c: a body slot offers both sources (camera and library); closed again without picking.
- tapOn:
    text: "Boy fotoğrafı ekle|Add full-length photo"
    index: 0
- extendedWaitUntil:
    visible:
      id: "photoSource.body.library"
    timeout: 10000
- assertVisible:
    id: "photoSource.body.camera"
- waitForAnimationToEnd
- takeScreenshot: 04c-foto-kaynagi
- tapOn:
    id: "photoSource.close"
- waitForAnimationToEnd
- tapOn:
    id: "body.skip"

# 04b İlk 5 parça — five pieces from the ready-made library (GET v1/tenant/library/item)
- extendedWaitUntil:
    visible:
      id: "firstItems.item.lib-white-tshirt"
    timeout: 20000
- takeScreenshot: 04b-ilk-parcalar
- tapOn:
    id: "firstItems.item.lib-white-tshirt"
- tapOn:
    id: "firstItems.item.lib-black-tshirt"
- tapOn:
    id: "firstItems.item.lib-white-shirt"
- tapOn:
    id: "firstItems.item.lib-striped-shirt"
# A bottom too, so a look can be built (requirements-face.yaml builds one right after this flow).
- scrollUntilVisible:
    element:
      id: "firstItems.item.lib-blue-jeans"
    direction: DOWN
- tapOn:
    id: "firstItems.item.lib-blue-jeans"
- tapOn:
    id: "firstItems.continue"

# 05 Paywall — closed without buying
- extendedWaitUntil:
    visible:
      id: "paywall.close"
    timeout: 20000
- takeScreenshot: 05-paywall
- tapOn:
    id: "paywall.close"

# The five tabs
- extendedWaitUntil:
    visible:
      id: "tab.today"
    timeout: 20000
- takeScreenshot: 06-bugun
- tapOn:
    id: "tab.wardrobe"
- takeScreenshot: 10-gardirop
- tapOn:
    id: "tab.stylist"
- takeScreenshot: 16-stilist
- tapOn:
    id: "tab.discover"
- takeScreenshot: 20-kesfet
- tapOn:
    id: "tab.profile"
- takeScreenshot: 28-profil
