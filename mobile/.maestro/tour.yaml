# Design-QA tour without AI: for an account that is already signed in (e.g. right after smoke.yaml), relaunches the
# app in LANG and opens every non-AI screen by app link, one screenshot each. Nothing here starts an AI job
# (stylist, week plan, trip pack, recognition, palette analysis, try-on): only entry, empty and locked states.
# Run: maestro test -e LANG=en -e LOCALE=en_US .maestro/tour.yaml
appId: com.alatech.droplet
env:
  LANG: ${LANG}
  LOCALE: ${LOCALE}
---
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(${LANG})"
      AppleLocale: ${LOCALE}
- extendedWaitUntil:
    visible:
      id: "tab.today"
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: "animated-splash"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: t06-bugun
- scroll
- takeScreenshot: t06-bugun-alt
- tapOn:
    id: "tab.wardrobe"
- waitForAnimationToEnd
- takeScreenshot: t10-gardirop
- tapOn:
    id: "tab.stylist"
- waitForAnimationToEnd
- takeScreenshot: t16-stilist
- tapOn:
    id: "tab.discover"
- waitForAnimationToEnd
- takeScreenshot: t20-kesfet
- tapOn:
    id: "tab.profile"
- waitForAnimationToEnd
- takeScreenshot: t28-profil
- scroll
- takeScreenshot: t28-profil-alt

- runFlow: { file: open.yaml, env: { URL: "droplet://wardrobe/looks" } }
