# Screen tour for design review: signs in with an existing account (login.yaml), then opens every screen and
# takes one screenshot per canvas board. Screens are opened with app links (droplet://<route>), so the
# tour does not depend on copy or layout.
# Run: maestro test -e EMAIL=… -e PASSWORD=… -e LANG=tr -e LOCALE=tr_TR -e WEEK="2026-11-16" .maestro/screens.yaml
#      WEEK = Monday of the current week (ids of the weekly edit: edit_<WEEK>_<n>).
appId: com.alatech.droplet
env:
  EMAIL: ${EMAIL}
  WEEK: ${WEEK}
  PASSWORD: ${PASSWORD}
  LANG: ${LANG}
  LOCALE: ${LOCALE}
---
- runFlow: login.yaml

# 2 · Bugün
- runFlow:
    file: open.yaml
    env:
      URL: "droplet://plan/week"
- takeScreenshot: 07-haftalik-plan
- runFlow:
    file: open.yaml
    env:
      URL: "droplet://edit/edit_${WEEK}_1"
- takeScreenshot: 08-haftanin-editi
