# Screen tour for design review: signs in and onboards (onboard-existing.yaml), then opens every screen and
# takes one screenshot per canvas board. Screens are opened with app links (droplet://<route>), so the
# tour does not depend on copy or layout.
# Run: maestro test -e EMAIL="tour+$(date +%s)@example.com" -e WEEK="2026-11-16" .maestro/screens.yaml
#      WEEK = Monday of the current week (ids of the weekly edit: edit_<WEEK>_<n>).
appId: com.alatech.droplet
env:
  EMAIL: ${EMAIL}
  WEEK: ${WEEK}
  LANG: ${LANG}
  LOCALE: ${LOCALE}
---
- runFlow: onboard-existing.yaml

