# Checks that the password typed at sign-up is the password that signs in again:
# register in the app (password typed into the HIDDEN field, as a user does), reveal it for the
# screenshot, finish, sign out from 29 Ayarlar, sign in again with the same password.
# Run: maestro test -e EMAIL="roundtrip+$(date +%s)@example.com" -e PASSWORD=… -e LANG=tr -e LOCALE=tr_TR .maestro/password-roundtrip.yaml
appId: com.alatech.droplet
env:
  EMAIL: ${EMAIL}
  PASSWORD: ${PASSWORD}
  LANG: ${LANG}
  LOCALE: ${LOCALE}
---
- launchApp:
    clearState: true
    clearKeychain: true
    arguments:
      AppleLanguages: "(${LANG})"
      AppleLocale: ${LOCALE}
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
- extendedWaitUntil:
    visible:
      id: "welcome.start"
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: "animated-splash"
    timeout: 10000
- tapOn:
    id: "welcome.start"
- tapOn:
    id: "auth.name"
- inputText: "Damla"
- pressKey: Enter
- inputText: ${EMAIL}
- tapOn:
    point: "50%,14%"
- tapOn:
    id: "auth.password"
- inputText: ${PASSWORD}
- tapOn:
    point: "50%,14%"
- tapOn:
    id: "auth.password.toggle"
- takeScreenshot: roundtrip-1-typed-hidden-then-revealed
- tapOn:
    id: "auth.submit"
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: "style.continue"
    timeout: 20000
- takeScreenshot: roundtrip-2-registered
