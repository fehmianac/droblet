AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Droblet landing - S3 static website bucket named after the domain, served through Cloudflare.
  A separate stack from the backend: there is one public site, not one per stage.
  Cloudflare sends the Host header unchanged and S3 website hosting finds the bucket by Host, so the
  bucket name must equal the domain. The S3 website endpoint is HTTP only; TLS ends at Cloudflare.

Parameters:
  LandingDomain:
    Type: String
    Default: droblet.alatech.co
    Description: The site's host name; also the bucket name.
  RestrictToCloudflare:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      true = objects are readable only from Cloudflare's IPv4 ranges (the DNS record must be proxied).
      false = readable by anyone on the S3 website endpoint (for checking before DNS is set up).

Conditions:
  CloudflareOnly: !Equals [!Ref RestrictToCloudflare, 'true']

Resources:
  LandingBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref LandingDomain
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: 404.html
      # A website bucket is read through a bucket policy, so policy-level blocks stay off; ACLs stay blocked.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: project
          Value: droblet

  LandingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LandingBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - !If
            - CloudflareOnly
            - Sid: ReadFromCloudflare
              Effect: Allow
              Principal: '*'
              Action: s3:GetObject
              Resource: !Sub '${LandingBucket.Arn}/*'
              Condition:
                IpAddress:
                  # https://www.cloudflare.com/ips-v4 — update here when Cloudflare changes the list.
                  aws:SourceIp:
                    - 173.245.48.0/20
                    - 103.21.244.0/22
                    - 103.22.200.0/22
                    - 103.31.4.0/22
                    - 141.101.64.0/18
                    - 108.162.192.0/18
                    - 190.93.240.0/20
                    - 188.114.96.0/20
                    - 197.234.240.0/22
                    - 198.41.128.0/17
                    - 162.158.0.0/15
                    - 104.16.0.0/13
                    - 104.24.0.0/14
                    - 172.64.0.0/13
                    - 131.0.72.0/22
            - Sid: PublicRead
              Effect: Allow
              Principal: '*'
              Action: s3:GetObject
              Resource: !Sub '${LandingBucket.Arn}/*'

Outputs:
  LandingBucketName:
    Value: !Ref LandingBucket
  LandingWebsiteHost:
    Description: CNAME target for the domain in Cloudflare (proxied).
    Value: !Sub '${LandingDomain}.s3-website.${AWS::Region}.amazonaws.com'
  LandingWebsiteUrl:
    Value: !GetAtt LandingBucket.WebsiteURL
