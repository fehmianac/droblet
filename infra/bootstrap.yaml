AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Droblet bootstrap - Lambda kod paketlerinin ve SAM artefaktlarinin durdugu deploy bucket'i.
  Ana stack'ten (template.yaml) once bir kez kurulur. Repo degiskeni DEPLOY_BUCKET doluysa bu stack atlanir.

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]

Resources:
  DeployBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'droblet-${Stage}-deploy-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: project
          Value: droblet
        - Key: stage
          Value: !Ref Stage

  DeployBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DeployBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt DeployBucket.Arn
              - !Sub '${DeployBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  DeployBucketName:
    Value: !Ref DeployBucket
