name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend - build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Droblet.sln

      - name: Build
        run: dotnet build Droblet.sln -c Release --no-restore

      - name: Test
        run: dotnet test Droblet.sln -c Release --no-build --logger "trx;LogFileName=test.trx"

      - name: Test sonuclari
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  infra:
    name: Infra - template lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # Lint yerelde calisir; AWS kimligi gerekmez. Bolge yalniz kaynak tiplerini cozmek icin.
      - name: sam validate --lint
        env:
          AWS_DEFAULT_REGION: eu-central-1
        run: |
          sam validate --lint --template-file template.yaml
          sam validate --lint --template-file infra/bootstrap.yaml

  mobile:
    name: Mobil - tsc + eslint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint .
