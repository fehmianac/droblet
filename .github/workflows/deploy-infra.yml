name: Deploy infra

# Altyapi (template.yaml) yalniz tag ile cikar:  infra-{dev|prod}-vX.Y.Z   (or. infra-prod-v0.1.0)
# Elle calistirma varsayilan olarak yalniz change set olusturur (onizleme); "execute" isaretlenirse uygular.

on:
  push:
    tags:
      - 'infra-dev-v*'
      - 'infra-prod-v*'
  workflow_dispatch:
    inputs:
      stage:
        description: Ortam
        type: choice
        options: [dev, prod]
        default: dev
      execute:
        description: Change set'i uygula (kapaliysa yalniz onizleme)
        type: boolean
        default: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}

jobs:
  resolve:
    name: Ortami belirle
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.r.outputs.stage }}
      execute: ${{ steps.r.outputs.execute }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: r
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IN_STAGE: ${{ inputs.stage }}
          IN_EXECUTE: ${{ inputs.execute }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            if [[ ! "$REF_NAME" =~ ^infra-(dev|prod)-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag bicimi yanlis: $REF_NAME (beklenen: infra-{dev|prod}-vX.Y.Z)"; exit 1
            fi
            stage="${BASH_REMATCH[1]}"
            git fetch origin main --quiet
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag'lenen commit main'de degil; deploy durduruldu."; exit 1
            fi
            execute=true
          else
            stage="$IN_STAGE"
            execute="$IN_EXECUTE"
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "execute=$execute" >> "$GITHUB_OUTPUT"
          echo "Ortam: **$stage** · uygula: **$execute**" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy (${{ needs.resolve.outputs.stage }})
    needs: resolve
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    environment: ${{ needs.resolve.outputs.stage }}
    concurrency:
      group: deploy-backend-${{ needs.resolve.outputs.stage }}
      cancel-in-progress: false
    env:
      STAGE: ${{ needs.resolve.outputs.stage }}
      EXECUTE: ${{ needs.resolve.outputs.execute }}
      STACK_NAME: droblet-${{ needs.resolve.outputs.stage }}
      BOOTSTRAP_STACK: droblet-${{ needs.resolve.outputs.stage }}-bootstrap
      DEPLOY_BUCKET_VAR: ${{ vars.DEPLOY_BUCKET }}
      DEPLOY_KEY: deploy.zip
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: sam validate --lint
        run: sam validate --lint --template-file template.yaml --region "$AWS_REGION"

      - name: Deploy bucket (bootstrap)
        id: bucket
        run: |
          set -euo pipefail
          if [ -n "$DEPLOY_BUCKET_VAR" ]; then
            bucket="$DEPLOY_BUCKET_VAR"
            echo "DEPLOY_BUCKET degiskeni dolu; bootstrap atlandi."
          else
            aws cloudformation deploy \
              --stack-name "$BOOTSTRAP_STACK" \
              --template-file infra/bootstrap.yaml \
              --parameter-overrides "Stage=$STAGE" \
              --no-fail-on-empty-changeset \
              --tags project=droblet "stage=$STAGE"
            bucket=$(aws cloudformation describe-stacks --stack-name "$BOOTSTRAP_STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='DeployBucketName'].OutputValue" --output text)
          fi
          # Lambda kodu stack ile ayni bolgedeki bucket'tan okunur.
          loc=$(aws s3api get-bucket-location --bucket "$bucket" --query LocationConstraint --output text)
          [ "$loc" = "None" ] && loc="us-east-1"
          if [ "$loc" != "$AWS_REGION" ]; then
            echo "::error::Deploy bucket'i $loc bolgesinde, stack $AWS_REGION bolgesinde. Ayni bolgede bir bucket kullan."; exit 1
          fi
          echo "name=$bucket" >> "$GITHUB_OUTPUT"

      - name: Stack durumu
        run: |
          set -euo pipefail
          status=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "NOT_FOUND")
          echo "Stack durumu: $status"
          case "$status" in
            ROLLBACK_COMPLETE|ROLLBACK_FAILED|CREATE_FAILED|DELETE_FAILED|UPDATE_ROLLBACK_FAILED)
              echo "::error::Stack $status durumunda. Retain'li kaynaklar oldugu icin otomatik silinmez; konsoldan incele."; exit 1 ;;
            REVIEW_IN_PROGRESS)
              # Yalniz onizleme change set'i olan, henuz hic kurulmamis stack: deploy edilebilir.
              echo "Stack yalniz onizleme asamasinda; devam." ;;
            *_IN_PROGRESS)
              echo "::error::Stack uzerinde baska bir islem suruyor ($status)."; exit 1 ;;
          esac

      - name: Ilk kod paketi (deploy.zip)
        env:
          BUCKET: ${{ steps.bucket.outputs.name }}
        run: |
          set -euo pipefail
          if aws s3api head-object --bucket "$BUCKET" --key "$DEPLOY_KEY" >/dev/null 2>&1; then
            echo "deploy.zip mevcut."
          else
            # Fonksiyonlar bu yer tutucuyla dogar; gercek kod deploy-lambdas.yml'den gelir.
            mkdir -p /tmp/placeholder
            echo "Droblet placeholder - gercek kod deploy-lambdas.yml ile yuklenir." > /tmp/placeholder/README.txt
            (cd /tmp/placeholder && zip -q -r /tmp/deploy.zip .)
            aws s3 cp /tmp/deploy.zip "s3://$BUCKET/$DEPLOY_KEY"
            echo "deploy.zip yoktu; yer tutucu yuklendi." >> "$GITHUB_STEP_SUMMARY"
          fi

      # CloudFormation, kendisinin olusturmadigi ayni adli bir kaynak varsa change set'i reddeder
      # (EarlyValidation::ResourceExistenceCheck). Konsoldan elle eklenmis bir "$default" stage bunu tetikler:
      # stack'e ait degilse silinir, ardindan sablon kendi "$default" stage'ini olusturur.
      - name: Stack disi $default stage temizligi
        if: env.EXECUTE == 'true'
        run: |
          set -euo pipefail
          api_id=$(aws cloudformation describe-stack-resource --stack-name "$STACK_NAME" \
            --logical-resource-id HttpApiGateway --query StackResourceDetail.PhysicalResourceId --output text 2>/dev/null || true)
          if [ -z "$api_id" ] || [ "$api_id" = "None" ]; then echo "API henuz yok; atlandi."; exit 0; fi
          managed=$(aws cloudformation describe-stack-resources --stack-name "$STACK_NAME" \
            --query "StackResources[?ResourceType=='AWS::ApiGatewayV2::Stage'].PhysicalResourceId" --output text)
          if printf '%s\n' $managed | grep -qx '\$default'; then
            echo "\$default stage stack'e ait; dokunulmadi."; exit 0
          fi
          if aws apigatewayv2 get-stage --api-id "$api_id" --stage-name '$default' >/dev/null 2>&1; then
            aws apigatewayv2 delete-stage --api-id "$api_id" --stage-name '$default'
            echo "Stack disi \$default stage silindi (api $api_id); sablon yenisini olusturacak." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Stack disi \$default stage yok."
          fi

      - name: sam deploy
        env:
          BUCKET: ${{ steps.bucket.outputs.name }}
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
        run: |
          set -euo pipefail
          overrides=("Stage=$STAGE" "DeploymentBucket=$BUCKET" "DeploymentKey=$DEPLOY_KEY")
          # Bos degiskenler gonderilmez: ilk kurulumda sablon varsayilani, sonra onceki deger kalir.
          add() { if [ -n "$2" ] && grep -qE "^  $1:" template.yaml; then overrides+=("$1=$2"); fi; }
          add AlarmEmail "$ALARM_EMAIL"

          args=(
            --template-file template.yaml
            --stack-name "$STACK_NAME"
            --region "$AWS_REGION"
            --s3-bucket "$BUCKET" --s3-prefix "sam/$STAGE"
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM
            --parameter-overrides "${overrides[@]}"
            --tags project=droblet "stage=$STAGE"
            --no-fail-on-empty-changeset
            --no-confirm-changeset
          )
          if [ "$EXECUTE" != "true" ]; then
            args+=(--no-execute-changeset)
            echo "Yalniz change set olusturuldu (onizleme). CloudFormation konsolundan incele." >> "$GITHUB_STEP_SUMMARY"
          fi
          sam deploy "${args[@]}"

      # Parameter Store iskeleti (/droblet/{stage}/...). Kural: YOKSA olusturulur, VAR OLAN ASLA EZILMEZ;
      # boylece urun sahibi degerleri AWS konsolundan girer ve sonraki deploy'lar onlara dokunmaz.
      # Gizli olmayan sabit ayarlar (Entitlements, Photos, App, Store, AuthRateLimits...) template.yaml'dadir.
      - name: Parameter Store iskeleti (SSM)
        if: env.EXECUTE == 'true'
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          set -euo pipefail
          base="/droblet/$STAGE"
          created=()
          ensure() { # ensure <name> <String|SecureString> <value> <aciklama>
            if aws ssm get-parameter --name "$base/$1" >/dev/null 2>&1; then
              echo "$base/$1 mevcut; dokunulmadi."
            else
              aws ssm put-parameter --name "$base/$1" --type "$2" --no-overwrite \
                --description "$4" --value "$3" >/dev/null
              created+=("$base/$1 ($2)")
              echo "$base/$1 olusturuldu ($2)."
            fi
          }

          # --- Gizli degerler (SecureString) ---
          jwt=$(openssl rand -base64 48 | tr -d '\n'); echo "::add-mask::$jwt"
          ensure "api/Jwt" SecureString "{\"SecretKey\":\"$jwt\"}" \
            "JWT imza anahtari. Otomatik uretildi; degistirmek tum oturumlari dusurur."
          # Admin paneli token imza anahtari: uygulama JWT anahtarindan AYRI (admin uclarinda kullanici token'i gecmez).
          adminjwt=$(openssl rand -base64 48 | tr -d '\n'); echo "::add-mask::$adminjwt"
          ensure "api/AdminJwt" SecureString "{\"SecretKey\":\"$adminjwt\"}" \
            "Admin paneli JWT imza anahtari. Otomatik uretildi; degistirmek tum admin oturumlarini dusurur."
          ensure "api/Email/SendGrid/ApiKey" SecureString "${SENDGRID_API_KEY:-CHANGE_ME}" \
            "SendGrid API anahtari (yalniz Mail Send yetkili). CHANGE_ME ise e-posta gitmez."
          ensure "api/Email/SendGrid/BaseUrl" String "https://api.sendgrid.com" \
            "SendGrid API adresi. AB'ye sabitlenmis hesap icin https://api.eu.sendgrid.com."
          ensure "api/AppleAuth/PrivateKey" SecureString "CHANGE_ME" \
            "Sign in with Apple .p8 anahtari (token iptali icin; giris dogrulamasi icin gerekmez)."
          ensure "api/Store/NotificationKey" SecureString "CHANGE_ME" \
            "Magaza sunucu bildirimlerini dogrulama anahtari (uyelik satin alma acilinca)."
          # Affiliate donusum bildirimlerini (postback) imzalayan ortak sirlar: ag ve dogrudan marka anlasmalari.
          # Uretilen deger ilgili aga / markaya verilir; yoksa her postback reddedilir.
          net=$(openssl rand -hex 32); echo "::add-mask::$net"
          dir=$(openssl rand -hex 32); echo "::add-mask::$dir"
          ensure "api/AffiliatePostback/NetworkSecret" SecureString "$net" \
            "Affiliate agi postback imza sirri (HMAC). Otomatik uretildi; aga bu deger verilir."
          ensure "api/AffiliatePostback/DirectSecret" SecureString "$dir" \
            "Dogrudan marka anlasmalari icin varsayilan postback imza sirri. Otomatik uretildi."
          ensure "worker/Ai/ApiKey" SecureString "CHANGE_ME" \
            "AI saglayici (OpenAI) API anahtari. CHANGE_ME ise AI isleri calismaz."
          ensure "notifier/Push/ServiceAccountJson" SecureString "CHANGE_ME" \
            "Firebase (FCM) servis hesabi JSON'u. CHANGE_ME ise push gitmez."
          # Uygulama ici satin alma (StoreKit 2 / Play Billing) ve magaza bildirimleri — docs/store-setup.md.
          ensure "api/Store/IapPrivateKey" SecureString "CHANGE_ME" \
            "App Store Connect In-App Purchase anahtari (.p8). CHANGE_ME ise App Store Server API kullanilmaz; StoreKit JWS yine dogrulanir."
          ensure "api/Store/GooglePlayServiceAccountJson" SecureString "CHANGE_ME" \
            "Play Developer API servis hesabi JSON'u. CHANGE_ME ise Android satin alma dogrulanamaz (501)."
          apple_token_key=$(openssl rand -base64 32 | tr -d '\n'); echo "::add-mask::$apple_token_key"
          ensure "api/AppleAuth/TokenEncryptionKey" SecureString "$apple_token_key" \
            "Saklanan Apple refresh token'ini sifreleyen AES-256 anahtari. Otomatik uretildi; degistirmek eski token'lari iptal edilemez yapar."
          ensure "notifier/Push/ApnsKey" SecureString "CHANGE_ME" \
            "APNs .p8 anahtari (iOS push, token auth). CHANGE_ME ise iOS'a push gitmez."

          # --- Urun sahibinin duzenledigi ayarlar (String, JSON) ---
          ensure "api/Email" String \
            '{"Provider":"SendGrid","From":"Droblet <no-reply@droblet.alatech.co>"}' \
            "E-posta saglayicisi (SendGrid | Smtp) ve gonderen adresi."
          ensure "api/GoogleAuth" String \
            '{"AndroidPackage":"com.alatech.droplet","ClientIds":[]}' \
            "Google ile giris: kabul edilen OAuth client id'leri (iOS, Android, web). Bos ise Google girisi 503 doner."
          ensure "api/AppleAuth" String \
            '{"BundleId":"com.alatech.droplet","AdditionalAudiences":[]}' \
            "Apple ile giris: identityToken aud = bundle id. TeamId/KeyId token iptali icin eklenir."
          ensure "api/Store/IapKeyId" String "CHANGE_ME" \
            "In-App Purchase anahtarinin Key ID'si (App Store Connect → Users and Access → Integrations → In-App Purchase)."
          ensure "api/Store/IssuerId" String "CHANGE_ME" \
            "App Store Connect API Issuer ID (ayni sayfanin ustunde)."
          ensure "api/Store/GooglePubSubAudience" String "CHANGE_ME" \
            "Play RTDN Pub/Sub push aboneliginin OIDC audience degeri (genelde bildirim URL'si)."
          ensure "api/Store/GooglePubSubServiceAccount" String "CHANGE_ME" \
            "Pub/Sub push aboneliginin kimlik dogruladigi servis hesabi e-postasi."
          ensure "api/AppleAuth/KeyId" String "CHANGE_ME" \
            "Sign in with Apple anahtarinin Key ID'si (token iptali icin)."
          ensure "api/AppleAuth/TeamId" String "4LB4RD97A9" \
            "Apple Developer Team ID (client secret iss)."
          ensure "notifier/Push/ApnsKeyId" String "CHANGE_ME" \
            "APNs anahtarinin Key ID'si."
          ensure "notifier/Push/ApnsTeamId" String "4LB4RD97A9" \
            "APNs provider token iss = Apple Developer Team ID."
          ensure "worker/Ai" String \
            '{"Enabled":false,"Provider":"OpenAI","TextModel":"gpt-6-astra","ImageModel":"gpt-image-2.5-sunburst"}' \
            "AI: acik/kapali, model kimlikleri. Model kimliklerini saglayicinin gercek adlariyla teyit et."

          # Secret sonradan eklendiyse ve parametre hala yer tutucuysa bir kez doldur.
          if [ -n "${SENDGRID_API_KEY:-}" ]; then
            cur=$(aws ssm get-parameter --name "$base/api/Email/SendGrid/ApiKey" --with-decryption \
              --query Parameter.Value --output text)
            if [ "$cur" = "CHANGE_ME" ]; then
              aws ssm put-parameter --name "$base/api/Email/SendGrid/ApiKey" --type SecureString \
                --overwrite --value "$SENDGRID_API_KEY" >/dev/null
              created+=("$base/api/Email/SendGrid/ApiKey (secret'tan dolduruldu)")
            fi
          fi

          {
            echo "### Parameter Store ($base)"
            if [ ${#created[@]} -eq 0 ]; then echo "Yeni parametre yok; var olanlara dokunulmadi."; else
              printf -- '- olusturuldu: `%s`\n' "${created[@]}"; fi
            echo
            echo "Degeri \`CHANGE_ME\` olanlar konsoldan doldurulmali: Systems Manager → Parameter Store → eu-central-1."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Output'lar
        if: env.EXECUTE == 'true'
        run: |
          {
            echo "### $STACK_NAME output'lari"
            echo
            echo "| Anahtar | Deger |"
            echo "|---|---|"
            aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[].[OutputKey,OutputValue]" --output text \
              | awk -F'\t' '{printf "| %s | `%s` |\n", $1, $2}'
            echo
            echo "Sonraki adim: **Deploy lambdas** workflow'unu calistir (fonksiyonlar yer tutucu kodla dogdu)."
          } >> "$GITHUB_STEP_SUMMARY"
