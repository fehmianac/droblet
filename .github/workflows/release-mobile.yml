name: Release mobile

# mobile-v1.2.3 → iOS + Android · ios-v1.2.3 → iOS only · android-v1.2.3 → Android only.
# The tag's version becomes the app version. A tag builds on a GitHub-hosted Mac (macos-26: Xcode → TestFlight,
# fastlane → Play):
# no expo.dev build, no EXPO_TOKEN. The build number is the run number. EAS cloud is a manual-run option only.
on:
  push:
    tags: ['mobile-v*', 'ios-v*', 'android-v*']
  # Manual run: the same release without a tag, or the EAS cloud builder (needs EXPO_TOKEN).
  workflow_dispatch:
    inputs:
      version:
        description: 'x.y.z (the store version)'
        required: true
      platform:
        description: all | ios | android
        default: ios
      builder:
        description: 'cloud = EAS build (paid minutes) · local = GitHub macOS runner (Xcode, no expo.dev build)'
        default: local
        type: choice
        options: [local, cloud]

permissions:
  contents: read

concurrency:
  group: release-mobile
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ vars.MOBILE_RUNNER || 'macos-26' }}
    environment: mobile-release   # required reviewer: a tag proposes a release, a person lets it out
    defaults:
      run: { working-directory: mobile }
    env:
      # The provisioning profile's name in Certificates, Identifiers & Profiles. Manual signing matches on this.
      # App Store profile for com.alatech.droplet. Droblet has no widget/extension target, so there is one profile.
      PROFILE_NAME: droplet-appstore-ios
      # app.config.ts adds expo.extra.eas.projectId only from this (push tokens and eas build need it)
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      # Only the cloud builder needs the EAS CLI; the local one uses Xcode and Apple's own upload tool.
      # TODO(devops): Dependabot ilk PR'ında commit SHA'sına sabitlenecek
      - uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # 9.0.1
        if: github.event_name == 'workflow_dispatch' && inputs.builder == 'cloud'
        with: { eas-version: latest, token: '${{ secrets.EXPO_TOKEN }}' }
      - name: Version and platform from tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          IN_PLATFORM: ${{ inputs.platform }}
          IN_VERSION: ${{ inputs.version }}
          IN_BUILDER: ${{ inputs.builder }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            platform="$IN_PLATFORM"; version="$IN_VERSION"; builder="$IN_BUILDER"
          else
            tag="${GITHUB_REF_NAME}"
            case "$tag" in
              mobile-v*)  platform=all;     version="${tag#mobile-v}" ;;
              ios-v*)     platform=ios;     version="${tag#ios-v}" ;;
              android-v*) platform=android; version="${tag#android-v}" ;;
            esac
            builder=local   # GitHub macOS runner; EAS cloud only from a manual run
          fi
          # Both builders read these two instead of re-deriving the platform in every condition.
          case "$platform" in
            all)     ios=true;  android=true ;;
            ios)     ios=true;  android=false ;;
            android) ios=false; android=true ;;
            *) echo "::error::platform must be all, ios or android"; exit 1 ;;
          esac
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "builder=$builder" >> "$GITHUB_OUTPUT"
      # Before forty minutes of EAS: an unlinked project, a missing token or a placeholder fails here, not at submit.
      - name: Release preconditions
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORM: ${{ steps.tag.outputs.platform }}
        run: |
          [[ "${{ steps.tag.outputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be x.y.z"; exit 1; }
          if [ "${{ steps.tag.outputs.builder }}" = cloud ]; then
            [ -n "$EXPO_TOKEN" ] || { echo "::error::EXPO_TOKEN is not set on the mobile-release environment"; exit 1; }
          fi
          # eas build needs the project id; a local build only loses push notifications without it
          if [ -z "$EAS_PROJECT_ID" ] && ! jq -e '.expo.extra.eas.projectId // empty' app.json >/dev/null; then
            if [ "${{ steps.tag.outputs.builder }}" = cloud ]; then
              echo "::error::no EAS project id — set the EAS_PROJECT_ID repository variable (npx eas init prints it)"; exit 1
            fi
            echo "::warning::no EAS_PROJECT_ID — this build cannot register for push notifications (npx eas init prints the id)"
          fi
          # Placeholders in this repo look like "[APPLE_TEAM_ID]"
          placeholder='REPLACE_WITH_|"\['
          if jq -c '.build.production.env' eas.json | grep -qE "$placeholder"; then
            echo "::error::eas.json build.production.env still holds a placeholder (DROBLET_API_BASE_URL)"; exit 1; fi
          if [ "$PLATFORM" != android ] && jq -c '.submit.production.ios' eas.json | grep -qE "$placeholder"; then
            echo "::error::eas.json submit.production.ios still holds placeholders — release with android-v* until iOS is set up"; exit 1; fi
      # The local builder's own preconditions: each check exists because that is a failure somebody actually hit.
      - name: Local build preconditions
        id: local
        if: steps.tag.outputs.builder == 'local'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -eu
          need() {
            eval "val=\${$1:-}"
            [ -n "$val" ] || { echo "::error::$1 is not set — $2"; exit 1; }
          }
          p12=false
          if [ "${{ steps.tag.outputs.ios }}" = true ]; then
            command -v xcodebuild >/dev/null || { echo "::error::Xcode command line tools are missing on this runner"; exit 1; }
            command -v pod >/dev/null || { echo "::error::CocoaPods is missing (brew install cocoapods)"; exit 1; }
            for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
              need "$v" "the App Store Connect API key replaces expo.dev's credential service"
            done
            # Either a .p12 to import, or an identity already in a keychain this runner can reach. Nothing else signs.
            if [ -n "${IOS_DIST_P12:-}" ]; then
              p12=true
            elif security find-identity -v -p codesigning | grep -q '0 valid identities found'; then
              echo "::error::no code-signing identity on this runner. Either set IOS_DIST_P12 (+ IOS_DIST_P12_PASSWORD), or import the distribution certificate into a keychain the runner can unlock."; exit 1
            fi
          fi
          if [ "${{ steps.tag.outputs.android }}" = true ]; then
            need ANDROID_KEYSTORE_BASE64 "the upload keystore, base64-encoded — Play rejects anything signed with another key"
            need ANDROID_KEYSTORE_PASSWORD "the keystore password"
            need ANDROID_KEY_ALIAS "the key alias inside the keystore"
            need PLAY_SERVICE_ACCOUNT_JSON "the Play service account JSON — it is what uploads the bundle"
            command -v fastlane >/dev/null || { echo "::error::fastlane is missing (brew install fastlane) — it is what uploads the bundle to Play"; exit 1; }
          fi
          echo "p12=$p12" >> "$GITHUB_OUTPUT"
      # Ask Apple whether the key works, before ten minutes of building. "Cloud signing permission error" at export
      # has causes that all stay invisible until then: the wrong **kind** of key — an In-App Purchase
      # key (SubscriptionKey_*.p8, which belongs in SSM for the App Store Server API) instead of an App Store
      # Connect API key (AuthKey_*.p8) — an unregistered bundle identifier, or unaccepted program agreements.
      # Not the role: Apple's roles table gives Account Holder, Admin **and App Manager** the right to create
      # distribution certificates and profiles.
      - name: App Store Connect key works
        if: steps.tag.outputs.builder == 'local' && steps.tag.outputs.ios == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -eu
          BUNDLE_ID="$(jq -r '.expo.ios.bundleIdentifier' app.json)"
          export BUNDLE_ID
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > /tmp/asc.p8
          code=$(node -e '
            const crypto = require("crypto"), fs = require("fs");
            const pem = fs.readFileSync("/tmp/asc.p8", "utf8");
            const b64u = (b) => Buffer.from(b).toString("base64url");
            const head = b64u(JSON.stringify({ alg: "ES256", kid: process.env.ASC_KEY_ID, typ: "JWT" }));
            const body = b64u(JSON.stringify({
              iss: process.env.ASC_ISSUER_ID, aud: "appstoreconnect-v1",
              iat: Math.floor(Date.now() / 1000), exp: Math.floor(Date.now() / 1000) + 600,
            }));
            const sig = crypto.sign("sha256", Buffer.from(head + "." + body), { key: pem, dsaEncoding: "ieee-p1363" });
            const jwt = head + "." + body + "." + b64u(sig);
            // /v1/profiles, not /v1/apps: this is the Certificates, Identifiers & Profiles API, which is exactly
            // what cloud signing uses. A key that can read the app list may still be refused here, and that
            // refusal is the "Cloud signing permission error" the export dies on.
            const api = (path) =>
              fetch("https://api.appstoreconnect.apple.com" + path, { headers: { Authorization: "Bearer " + jwt } });
            api("/v1/profiles?limit=1")
              .then(async (r) => {
                if (r.status !== 200) return console.log(r.status);
                const b = await api("/v1/bundleIds?filter[identifier]=" + process.env.BUNDLE_ID + "&limit=1").then((x) => x.json());
                console.log(b?.data?.length ? "200" : "nobundle");
              })
              .catch(() => { console.log("0"); });
          ')
          rm -f /tmp/asc.p8
          case "$code" in
            200) echo "key can read provisioning profiles, and $BUNDLE_ID is registered" ;;
            nobundle) echo "::error::the key works, but no bundle id '$BUNDLE_ID' exists on this account. Cloud signing cannot make a profile for an identifier that is not registered — add it in Certificates, Identifiers & Profiles."; exit 1 ;;
            401) echo "::error::App Store Connect rejected the key (401). Most likely the wrong kind: the build needs an **App Store Connect API** key (downloads as AuthKey_*.p8), not an In-App Purchase key (SubscriptionKey_*.p8) — that one belongs in SSM Store. Also check ASC_ISSUER_ID comes from the same page as the key."; exit 1 ;;
            403) echo "::error::the key is valid but may not touch provisioning (403), which is what cloud signing needs. Give the key a role that can manage certificates and profiles, and make sure the Apple Developer Program agreements are accepted."; exit 1 ;;
            0)   echo "::warning::could not reach App Store Connect to check the key; continuing" ;;
            *)   echo "::warning::App Store Connect answered $code to the profiles check; continuing" ;;
          esac

      - run: npm ci
      # tsc passes on imports a bundler refuses; expo export is the bundling EAS is about to do.
      # check = typecheck + lint + test
      - run: npm run check
      - run: npx expo export --platform ${{ steps.tag.outputs.ios == 'true' && 'ios' || 'android' }} --output-dir "$RUNNER_TEMP/export-check"
      # The store version is app.json's expo.version (EAS uploads the working tree, uncommitted change included);
      # the build number is EAS's (appVersionSource remote + autoIncrement on the production profile).
      - name: Set version
        run: |
          npm pkg set version=${{ steps.tag.outputs.version }}
          jq --arg v "${{ steps.tag.outputs.version }}" '.expo.version = $v' app.json > app.json.tmp && mv app.json.tmp app.json
      - name: Build (awaited)
        if: steps.tag.outputs.builder == 'cloud'
        run: eas build --platform ${{ steps.tag.outputs.platform }} --profile production --non-interactive --wait
      - name: Play service account
        if: steps.tag.outputs.builder == 'cloud' && steps.tag.outputs.platform != 'ios'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json
      - name: Submit
        if: steps.tag.outputs.builder == 'cloud'
        run: eas submit --platform ${{ steps.tag.outputs.platform }} --profile production --latest --non-interactive --wait
      - name: Remove service account
        if: always()
        run: rm -f play-service-account.json

      # ---- local iOS: the macOS runner archives, Apple's own tools upload. No expo.dev build, no EAS minutes. ----
      # The build number is the run number: monotonic, visible in the run's URL, and it needs no remote state the way
      # eas.json's appVersionSource: remote does — that one belongs to the cloud builder.
      # eas.json's build.production.env is applied by **EAS**, not by expo prebuild or xcodebuild — they see only the
      # shell. Without this the local build would ship an app with no API address. Droblet's app.config.ts reads
      # DROBLET_* from the environment into expo.extra (at prebuild and again when the bundle is embedded inside
      # xcodebuild / gradle), so exporting them here is what reaches the app.
      - name: Production environment (from eas.json)
        if: steps.tag.outputs.builder == 'local'
        run: |
          set -eu
          jq -r '.build.production.env | to_entries[] | "\(.key)=\(.value)"' eas.json | tee -a "$GITHUB_ENV"
          api="$(jq -r '.build.production.env.DROBLET_API_BASE_URL // empty' eas.json)"
          case "$api" in
            https://*) : ;;
            *) echo "::error::eas.json build.production.env.DROBLET_API_BASE_URL is missing or not https — the app would have no API address"; exit 1 ;;
          esac

      - name: Native project (prebuild)
        if: steps.tag.outputs.builder == 'local'
        run: |
          set -eu
          # The build number is the run number on both stores: monotonic, visible in the run's URL, and it needs no
          # remote state the way eas.json's appVersionSource: remote does — that one belongs to the cloud builder.
          # Android's versionCode is a number, iOS's buildNumber a string; Play refuses a code it has seen before.
          if [ "${{ steps.tag.outputs.ios }}" = true ]; then
            jq --arg b '${{ github.run_number }}' '.expo.ios.buildNumber = $b' app.json > app.json.tmp && mv app.json.tmp app.json
            npx expo prebuild --platform ios --clean
            # Without this key App Store Connect holds every build at "Missing Compliance" until someone answers the
            # export questions by hand. app.json's ios.config.usesNonExemptEncryption writes it; fail if it ever doesn't.
            apps=0
            for plist in ios/*/Info.plist; do
              /usr/libexec/PlistBuddy -c 'Print :NSExtension' "$plist" >/dev/null 2>&1 && continue
              apps=$((apps + 1))
              v="$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$plist" 2>/dev/null || true)"
              [ "$v" = false ] || { echo "::error::$plist lacks ITSAppUsesNonExemptEncryption = false (app.json ios.config.usesNonExemptEncryption)"; exit 1; }
            done
            [ "$apps" -gt 0 ] || { echo "::error::no app Info.plist found under ios/"; exit 1; }
            (cd ios && pod install)
          fi
          if [ "${{ steps.tag.outputs.android }}" = true ]; then
            jq --argjson c ${{ github.run_number }} '.expo.android.versionCode = $c' app.json > app.json.tmp && mv app.json.tmp app.json
            npx expo prebuild --platform android --clean
          fi

      - name: Signing keychain
        if: steps.local.outputs.p12 == 'true'
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          set -eu
          # A keychain of its own, deleted at the end of the run whatever happens.
          pass="$(uuidgen)"
          security create-keychain -p "$pass" droblet-release.keychain
          security set-keychain-settings -lut 3600 droblet-release.keychain
          security unlock-keychain -p "$pass" droblet-release.keychain
          printf '%s' "$IOS_DIST_P12" | base64 --decode > /tmp/dist.p12
          security import /tmp/dist.p12 -k droblet-release.keychain -P "$IOS_DIST_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" droblet-release.keychain >/dev/null
          security list-keychains -d user -s droblet-release.keychain $(security list-keychains -d user | tr -d '"')
          rm -f /tmp/dist.p12
          security find-identity -v -p codesigning droblet-release.keychain

      # Manual signing looks the profile up among the installed ones; nothing fetches it. Without this the export
      # answers "No profiles for '<bundle id>' were found" exactly as cloud signing did.
      - name: Provisioning profiles
        if: steps.tag.outputs.builder == 'local' && steps.tag.outputs.ios == 'true'
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -eu
          bundle="${BUNDLE_ID:-$(jq -r '.expo.ios.bundleIdentifier' app.json)}"
          have="$(security find-identity -v -p codesigning | grep -oE '[0-9A-F]{40}' || true)"

          # install <secret name> <base64 profile> <expected name> <bundle id> <required entitlements…>
          install() {
            local secret="$1" encoded="$2" expected="$3" target="$4"; shift 4
            [ -n "$encoded" ] || { echo "::error::$secret is not set. Download the App Store profile for $target from Certificates, Identifiers & Profiles and add it base64-encoded."; exit 1; }
            printf '%s' "$encoded" | base64 --decode > /tmp/profile.mobileprovision
            security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
            local name uuid appid expires
            name=$(plutil -extract Name raw -o - /tmp/profile.plist)
            uuid=$(plutil -extract UUID raw -o - /tmp/profile.plist)
            appid=$(plutil -extract Entitlements.application-identifier raw -o - /tmp/profile.plist)
            expires=$(plutil -extract ExpirationDate raw -o - /tmp/profile.plist)
            echo "profile from $secret: $name · $appid · $uuid · expires $expires"
            [ "$name" = "$expected" ] || { echo "::error::$secret is named '$name' while the export asks for '$expected'"; exit 1; }
            case "$appid" in
              *."$target") : ;;
              *) echo "::error::$secret is for '${appid#*.}', not '$target'. Create an App Store profile for $target and replace $secret."; exit 1 ;;
            esac
            # Missing capabilities otherwise surface only at export, after the whole archive
            local missing="" ent
            for ent in "$@"; do
              /usr/libexec/PlistBuddy -c "Print :Entitlements:$ent" /tmp/profile.plist >/dev/null 2>&1 || missing="$missing $ent"
            done
            [ -z "$missing" ] || { echo "::error::$secret lacks:$missing — enable the capability on the $target App ID, regenerate the profile and replace $secret."; exit 1; }

            # A profile carries the certificates it was generated against; the export refuses the archive when the
            # keychain identity is not one of them. Named here instead of forty minutes later.
            echo "certificates $name accepts:"
            local certs match=no i=0 subject sha mark
            certs=$(plutil -extract DeveloperCertificates raw -o - /tmp/profile.plist)
            while [ "$i" -lt "$certs" ]; do
              plutil -extract DeveloperCertificates.$i raw -o - /tmp/profile.plist | base64 --decode > /tmp/profile-cert.der
              subject=$(openssl x509 -inform DER -in /tmp/profile-cert.der -noout -subject | sed 's/.*CN=//; s/\/.*//')
              sha=$(openssl x509 -inform DER -in /tmp/profile-cert.der -noout -fingerprint -sha1 | sed 's/.*=//; s/://g')
              case "$have" in *"$sha"*) mark="· in the keychain"; match=yes ;; *) mark="" ;; esac
              echo "  $sha  $subject $mark"
              i=$((i + 1))
            done
            rm -f /tmp/profile-cert.der
            [ "$match" = yes ] || { echo "::error::none of the certificates in '$name' is the one IOS_DIST_P12 holds. Edit the profile, tick the certificate listed above as being in the keychain, download it again and replace $secret — or export the p12 from the certificate the profile already carries."; exit 1; }

            # Xcode 16+ reads profiles from UserData, older Xcode from MobileDevice — installed in both. The export
            # looks profiles up by **name**, so a stale same-named one would win; those are removed first.
            local dir f n
            for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$dir"
              for f in "$dir"/*.mobileprovision "$dir"/*.provisionprofile; do
                [ -e "$f" ] || continue
                n=$(security cms -D -i "$f" 2>/dev/null | plutil -extract Name raw -o - - 2>/dev/null || true)
                [ "$n" = "$name" ] && { echo "removing stale '$n': $f"; rm -f "$f"; }
              done
              cp /tmp/profile.mobileprovision "$dir/$uuid.mobileprovision"
            done
            rm -f /tmp/profile.mobileprovision /tmp/profile.plist
            echo "$uuid" >> "$RUNNER_TEMP/profile-uuids"
            echo "installed profile: $name · $appid"
          }

          : > "$RUNNER_TEMP/profile-uuids"
          # Droblet's App ID capabilities: Push Notifications, Sign in with Apple, Associated Domains (applinks).
          # No App Groups and no second profile: there is no widget/extension target.
          install IOS_PROVISIONING_PROFILE "${IOS_PROVISIONING_PROFILE:-}" "${{ env.PROFILE_NAME }}" "$bundle" \
            aps-environment com.apple.developer.applesignin com.apple.developer.associated-domains

      - name: Archive, export and upload to TestFlight
        if: steps.tag.outputs.builder == 'local' && steps.tag.outputs.ios == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -eu
          # expo prebuild leaves the generated project without a team — eas.json's appleTeamId is read by EAS, not by
          # xcodebuild — so a local archive dies on "Signing for \"<app>\" requires a development team" while the
          # same build with signing disabled succeeds. Passed on the command line so the
          # generated project stays untouched.
          team="$(jq -r '.submit.production.ios.appleTeamId' eas.json)"
          [ -n "$team" ] && [ "$team" != null ] || { echo "::error::eas.json submit.production.ios.appleTeamId is missing"; exit 1; }
          # xcodebuild reads the key from a path it expects; altool takes the same key by id.
          # Only this run's key is written and removed.
          mkdir -p ~/.appstoreconnect/private_keys
          key=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key"
          chmod 600 "$key"

          ws="$(ls -d ios/*.xcworkspace | head -1)"
          scheme="$(basename "$ws" .xcworkspace)"
          echo "workspace $ws · scheme $scheme · team $team · build ${{ github.run_number }}"

          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${team}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST

          # Signing is settled at export, not here: a command line build setting reaches every target, and the Pods
          # and SwiftPM frameworks answer "ExpoCrypto does not support provisioning profiles" by the dozen.
          # So the archive keeps the automatic signing it already completes with, and
          # ExportOptions.plist re-signs the app manually against the profile installed above — which is the half
          # cloud signing could not produce for us.
          # Xcode will not run a SwiftPM build-tool plugin or macro it has not been told to trust, and in a
          # non-interactive build there is nobody to tell it. The plugins come from our own locked dependency tree,
          # which is what makes skipping them the right call here and not a shortcut.
          # The log goes to a file, not to the console: teeing xcodebuild's full output truncates the step in the
          # GitHub UI, which hides the very lines it was added to show. On failure the step prints the
          # parts that matter; the whole thing is uploaded as an artifact either way.
          set +e
          xcodebuild -workspace "$ws" -scheme "$scheme" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath ios/build/app.xcarchive \
            -allowProvisioningUpdates -skipPackagePluginValidation -skipMacroValidation \
            -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -resultBundlePath ios/build/archive.xcresult \
            DEVELOPMENT_TEAM="$team" CODE_SIGN_STYLE=Automatic \
            archive > ios/build/archive.log 2>&1
          status=$?
          set -e
          echo "archive finished with status $status · $(wc -l < ios/build/archive.log | tr -d ' ') lines of log"
          # A successful archive still deserves its warnings seen, just not its ten thousand notes.
          grep -cE "warning:" ios/build/archive.log | sed 's/^/warnings: /' || true
          if [ "$status" -ne 0 ]; then
            echo "::group::what failed"
            grep -nE "error:|The following build commands failed|Signing|Provisioning|No profiles|requires a provisioning|Command .* failed" \
              ios/build/archive.log | tail -40 || true
            echo "::endgroup::"
            echo "::group::last 60 lines"
            tail -60 ios/build/archive.log || true
            echo "::endgroup::"
            echo "::error::archive failed — the grouped output above has the reason"
            exit "$status"
          fi
          xcodebuild -exportArchive -archivePath ios/build/app.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist -exportPath ios/build/ipa \
            -skipPackagePluginValidation -skipMacroValidation \
            -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          ipa="$(ls ios/build/ipa/*.ipa | head -1)"
          # This is the TestFlight upload: App Store Connect processes it and the build appears there.
          xcrun altool --upload-app -f "$ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "uploaded $ipa — it shows up in TestFlight once App Store Connect finishes processing"

      # ---- local Android: the macOS runner bundles, fastlane uploads to Play. No EAS minutes here either. ----
      # The JDK and the Android SDK are found here rather than assumed from the runner's own environment.
      - name: Android toolchain
        if: steps.tag.outputs.builder == 'local' && steps.tag.outputs.android == 'true'
        run: |
          set -eu
          jh="${JAVA_HOME:-}"
          [ -n "$jh" ] || jh="$(/usr/libexec/java_home -v 17 2>/dev/null || true)"
          [ -n "$jh" ] || jh="$(/usr/libexec/java_home 2>/dev/null || true)"
          [ -n "$jh" ] || { echo "::error::no JDK on this runner — brew install --cask temurin@17"; exit 1; }
          major="$("$jh/bin/java" -version 2>&1 | sed -n 's/.*version "\([0-9][0-9]*\).*/\1/p' | head -1)"
          [ "${major:-0}" -ge 17 ] || { echo "::error::JDK ${major:-?} is too old — the generated project uses Gradle 9, which needs 17 or newer"; exit 1; }
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk" ]; then
            for c in "$HOME/Library/Android/sdk" /opt/homebrew/share/android-commandlinetools /usr/local/share/android-commandlinetools; do
              [ -d "$c" ] && { sdk="$c"; break; }
            done
          fi
          [ -n "$sdk" ] || { echo "::error::no Android SDK — brew install --cask android-commandlinetools"; exit 1; }
          # Gradle downloads the platform and build tools it needs, but only once the licences are accepted, and it
          # cannot ask a non-interactive build. So the acceptance is a person's one-off, checked here.
          [ -f "$sdk/licenses/android-sdk-license" ] || { echo "::error::the Android SDK licences are not accepted — run: yes | $sdk/cmdline-tools/latest/bin/sdkmanager --licenses"; exit 1; }
          { echo "JAVA_HOME=$jh"; echo "ANDROID_HOME=$sdk"; echo "ANDROID_SDK_ROOT=$sdk"; } >> "$GITHUB_ENV"
          echo "jdk $major at $jh · sdk $sdk · fastlane $(fastlane --version 2>/dev/null | tail -1)"

      - name: Signed bundle and upload to Play
        if: steps.tag.outputs.builder == 'local' && steps.tag.outputs.android == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: |
          set -eu
          # keytool has produced PKCS12 keystores since JDK 9, and there the key password cannot differ from the
          # store password — it is never even asked for. So ANDROID_KEY_PASSWORD is optional and defaults to it.
          : "${ANDROID_KEY_PASSWORD:=$ANDROID_KEYSTORE_PASSWORD}"
          export ANDROID_KEY_PASSWORD
          export ANDROID_KEYSTORE_PATH="$PWD/android/app/upload.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

          # The generated project signs the release build with the **debug** key — "Caution! In production, you need
          # to generate your own keystore file" is still sitting in the file, and Play rejects
          # a debug-signed bundle. So the release signing config is written in and pointed at. The passwords come
          # from the environment: a gradle.properties file would survive the run, and -P puts them in ps output.
          python3 - <<'PY'
          p = 'android/app/build.gradle'
          s = open(p).read()
          anchor = '    signingConfigs {\n'
          assert s.count(anchor) == 1, 'signingConfigs block not found — the Expo template changed'
          block = '\n'.join([
              '        release {',
              '            storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))',
              '            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")',
              '            keyAlias System.getenv("ANDROID_KEY_ALIAS")',
              '            keyPassword System.getenv("ANDROID_KEY_PASSWORD")',
              '        }',
              '',
          ])
          s = s.replace(anchor, anchor + block, 1)
          old = '            // see https://reactnative.dev/docs/signed-apk-android.\n            signingConfig = signingConfigs.debug'
          assert s.count(old) == 1, 'the release build type no longer points at the debug key — check the template'
          s = s.replace(old, '            signingConfig = signingConfigs.release', 1)
          open(p, 'w').write(s)
          print('release signing written into android/app/build.gradle')
          PY

          # Same reason as the iOS archive: the full Gradle log truncates the step in the GitHub UI.
          set +e
          (cd android && ./gradlew :app:bundleRelease --no-daemon --console=plain) > gradle.log 2>&1
          status=$?
          set -e
          echo "bundleRelease finished with status $status · $(wc -l < gradle.log | tr -d ' ') lines of log"
          if [ "$status" -ne 0 ]; then
            echo "::group::what failed"
            # Kotlin reports with "e: file://…", which "error:" does not match.
            grep -nE "^e: |FAILURE|error:|What went wrong|Caused by|> Task .* FAILED|Compilation error" gradle.log | tail -40 || true
            echo "::endgroup::"
            echo "::group::last 60 lines"
            tail -60 gradle.log || true
            echo "::endgroup::"
            echo "::error::bundleRelease failed — the grouped output above has the reason"
            exit "$status"
          fi

          aab=android/app/build/outputs/bundle/release/app-release.aab
          [ -f "$aab" ] || { echo "::error::gradle reported success but there is no bundle at $aab"; exit 1; }
          # Which key actually signed it. A bundle signed with the debug key is refused by Play with a message about
          # the certificate, far from the cause; this says it here instead.
          signer="$("$JAVA_HOME/bin/keytool" -printcert -jarfile "$aab" | awk '/SHA256:/ {print $2; exit}')"
          upload="$(printf '%s\n' "$ANDROID_KEYSTORE_PASSWORD" | "$JAVA_HOME/bin/keytool" -list -v -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" | awk '/SHA256:/ {print $2; exit}')"
          echo "bundle signed by $signer"
          [ "$signer" = "$upload" ] || { echo "::error::the bundle was signed by $signer, not by the upload key ($upload) — the signing config did not take"; exit 1; }
          echo "size $(du -h "$aab" | cut -f1) · versionCode ${{ github.run_number }}"

          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json
          pkg="$(jq -r '.expo.android.package' app.json)"
          supply() {
            fastlane supply --aab "$aab" --track internal --json_key play-service-account.json \
              --package_name "$pkg" --release_status "$1" \
              --skip_upload_metadata true --skip_upload_changelogs true \
              --skip_upload_images true --skip_upload_screenshots true
          }
          # An app with no released version yet only accepts draft releases, and Play says so in those words. The
          # normal case is a completed internal release, so that is tried first and the draft is the fallback.
          set +e
          out="$(supply completed 2>&1)"; status=$?
          set -e
          echo "$out" | tail -30
          if [ "$status" -ne 0 ] && echo "$out" | grep -qi 'draft app\|only releases with status draft'; then
            echo "the app has no released version yet — uploading as a draft release instead"
            supply draft
          elif [ "$status" -ne 0 ]; then
            echo "::error::fastlane supply failed — the output above has the reason"; exit "$status"
          fi
          echo "uploaded to the internal track — it appears in Play Console once Google finishes processing"

      # So a failure can be read here instead of copied out of the run's console.
      - name: Keep the build log
        if: always() && steps.tag.outputs.builder == 'local'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs
          path: |
            mobile/ios/build/archive.log
            mobile/ios/build/archive.xcresult
            mobile/gradle.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up signing material
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          security delete-keychain droblet-release.keychain 2>/dev/null || true
          [ -z "$ASC_KEY_ID" ] || rm -f ~/.appstoreconnect/private_keys/"AuthKey_${ASC_KEY_ID}.p8"
          rm -f /tmp/dist.p12 /tmp/asc.p8 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/profile-uuids" ]; then
            while read -r uuid; do
              [ -n "$uuid" ] || continue
              rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision" \
                "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision" 2>/dev/null || true
            done < "$RUNNER_TEMP/profile-uuids"
            rm -f "$RUNNER_TEMP/profile-uuids"
          fi
          rm -f /tmp/profile.mobileprovision /tmp/profile.plist 2>/dev/null || true
          rm -f android/app/upload.keystore play-service-account.json 2>/dev/null || true
