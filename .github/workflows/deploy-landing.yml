name: Deploy landing

# landing/** main'e girince ya da elle: bucket stack'i (infra/landing.yaml) kurulur/guncellenir,
# site build edilir ve landing/out/ bucket'a senkronlanir. Bucket adi = alan adi (droblet.alatech.co).

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'infra/landing.yaml'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:
    inputs:
      restrict_to_cloudflare:
        description: Okumayi yalniz Cloudflare IP'lerine ac (DNS proxy kurulmadan once "false" ile denenebilir)
        type: choice
        options: ['true', 'false']
        default: 'true'

permissions:
  contents: read

concurrency:
  group: deploy-landing
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  LANDING_DOMAIN: ${{ vars.LANDING_DOMAIN || 'droblet.alatech.co' }}
  STACK_NAME: droblet-landing

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bucket stack
        env:
          # push ile calisirken girdi yoktur: stack'teki onceki deger korunur (ilk kurulumda sablon varsayilani).
          RESTRICT: ${{ inputs.restrict_to_cloudflare }}
        run: |
          set -euo pipefail
          overrides=("LandingDomain=$LANDING_DOMAIN")
          [ -n "$RESTRICT" ] && overrides+=("RestrictToCloudflare=$RESTRICT")
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/landing.yaml \
            --parameter-overrides "${overrides[@]}" \
            --no-fail-on-empty-changeset \
            --tags project=droblet
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[].[OutputKey,OutputValue]" --output text \
            | awk -F'\t' 'BEGIN{print "| Anahtar | Deger |\n|---|---|"} {printf "| %s | `%s` |\n", $1, $2}' >> "$GITHUB_STEP_SUMMARY"

      # Ilk kurulumda bucket yanlis adla (droblet.alatech.co) acilmisti. Stack artik dogru adli bucket'i
      # kullaniyor; eski bucket Retain politikasi yuzunden kalir. Icinde yalniz bu workflow'un yukledigi
      # build ciktisi var: bosaltilip silinir. Bucket yoksa ya da baska hesaba aitse adim sessizce gecer.
      - name: Eski (yanlis adli) bucket temizligi
        run: |
          legacy="droblet.alatech.co"
          if [ "$legacy" != "$LANDING_DOMAIN" ] && aws s3api head-bucket --bucket "$legacy" 2>/dev/null; then
            aws s3 rb "s3://$legacy" --force
            echo "Eski bucket silindi: $legacy" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Eski bucket yok; atlandi."
          fi

      - name: Site var mi
        id: site
        run: |
          if [ -f landing/package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::landing/ henuz yok; yalniz bucket kuruldu."
          fi

      - uses: actions/setup-node@v5
        if: steps.site.outputs.exists == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Build
        if: steps.site.outputs.exists == 'true'
        working-directory: landing
        env:
          NEXT_PUBLIC_SITE_URL: https://${{ env.LANDING_DOMAIN }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          npm ci
          npm run build
          npm run check --if-present
          test -f out/index.html || { echo "::error::out/index.html yok; statik export basarisiz."; exit 1; }

      - name: Senkron
        if: steps.site.outputs.exists == 'true'
        working-directory: landing
        run: |
          set -euo pipefail
          bucket="s3://$LANDING_DOMAIN"
          # Hash'li dosyalar uzun sure onbellekte kalir; HTML ve digerleri her istekte dogrulanir.
          aws s3 sync out/_next "$bucket/_next" --delete --cache-control "public,max-age=31536000,immutable"
          aws s3 sync out "$bucket" --delete --exclude "_next/*" --exclude ".well-known/*" \
            --cache-control "public,max-age=0,must-revalidate"
          # Yanlis content-type ile sunulursa universal link / app link sessizce calismaz.
          if [ -f out/.well-known/apple-app-site-association ]; then
            aws s3 cp out/.well-known/apple-app-site-association "$bucket/.well-known/apple-app-site-association" \
              --content-type application/json --cache-control "public,max-age=3600"
          fi
          if [ -f out/.well-known/assetlinks.json ]; then
            aws s3 cp out/.well-known/assetlinks.json "$bucket/.well-known/assetlinks.json" \
              --content-type application/json --cache-control "public,max-age=3600"
          fi
          echo "Yayinlandi: https://$LANDING_DOMAIN" >> "$GITHUB_STEP_SUMMARY"
