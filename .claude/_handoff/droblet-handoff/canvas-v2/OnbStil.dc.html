<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Stil profili</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/e8430258669fc54f0b61d262bce30fdd">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Jost:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#1C1A17;text-decoration:none}a:hover{color:#6E5640}
</style>
</helmet>
<div class="scr">

<header class="row" style="height:48px;padding:0 20px;justify-content:space-between;position:relative;flex:none;margin-top:50px"><a href="Kayit.dc.html" class="ib" aria-label="Geri" style="border:0;width:44px;margin-left:-10px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><div class="row" style="gap:8px"><span class="sm" style="font-weight:500">1 / 3</span></div></header>
<div style="padding:0 24px;flex:none"><div style="height:3px;background:#DCD4C9;border-radius:2px"><div style="width:33%;height:3px;background:#1C1A17;border-radius:2px"></div></div></div>
<div style="padding:24px 24px 0;display:flex;flex-direction:column;gap:24px;flex:1">
  <div style="display:flex;flex-direction:column;gap:10px">
    <h1 class="h1">Seni biraz tanıyalım</h1>
    <p class="p">Haftalık edit'ler ve öneriler bu seçimlere göre hazırlanır. İstediğin zaman değiştirebilirsin.</p>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px">
    <p class="eb">KİMİN İÇİN ALIŞVERİŞ YAPIYORSUN?</p>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
      <button class="card" aria-pressed="true" style="height:92px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:12px;font-family:inherit;font-size:14px;font-weight:500;color:#F4F1EC;background:#1C1A17;border-color:#1C1A17;cursor:pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>Kadın</span></button>
      <button class="card" disabled style="height:92px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:12px;font-family:inherit;font-size:14px;font-weight:500;color:#1C1A17;background:#FBF9F5;border-color:#DCD4C9;cursor:not-allowed"><span class="badge" style="height:20px;font-size:10.5px">Yakında</span><span style="opacity:.55">Erkek</span></button>
      <button class="card" disabled style="height:92px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:12px;font-family:inherit;font-size:14px;font-weight:500;color:#1C1A17;background:#FBF9F5;border-color:#DCD4C9;cursor:not-allowed"><span class="badge" style="height:20px;font-size:10.5px">Yakında</span><span style="opacity:.55">Genç (13–18)</span></button>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px">
    <div class="row" style="justify-content:space-between"><p class="eb">TARZINI ANLATAN 3 ETİKET</p><span class="badge">{{ count }} / 3</span></div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <sc-for list="{{ tags }}" as="t" hint-placeholder-count="10"><button class="{{ t.cls }}" disabled="{{ t.locked }}" aria-pressed="{{ t.on }}" onClick="{{ t.toggle }}">{{ t.label }}</button></sc-for>
    </div>
    <p class="sm">3 etiket seçildi; değiştirmek için birini kaldır.</p>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px">
    <p class="eb">BÜTÇE TERCİHİN</p>
    <div class="row" style="gap:8px"><button class="chip">High street</button><button class="chip on">Karma</button><button class="chip">Lüks dokunuş</button></div>
  </div>
</div>
<div style="padding:0 24px 40px"><a href="OnbFoto.dc.html" class="btn">Devam et</a></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
  const all = ['Minimal','Klasik','Quiet luxury','Sokak','Bohem','Sportif','Romantik','Ofis şıklığı','Renkli','Vintage'];
  const sel = (this.state && this.state.sel) || ['Minimal','Quiet luxury','Ofis şıklığı'];
  const full = sel.length >= 3;
  const tags = all.map((label) => {
    const on = sel.indexOf(label) >= 0;
    const locked = full && !on;
    return {
      label, on, locked,
      cls: on ? 'chip on' : (locked ? 'chip dis' : 'chip'),
      toggle: () => {
        if (on) this.setState({ sel: sel.filter((x) => x !== label) });
        else if (!full) this.setState({ sel: sel.concat([label]) });
      }
    };
  });
  return { tags, count: sel.length };
}
}
</script>
</body>
</html>
