<div style="flex:1;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:0">
  <div style="padding:0 20px"><p class="eb">2–6 ARALIK · 5 GÜN</p><h1 class="h1" style="margin-top:4px">Londra</h1></div>

    <div class="card" style="flex:1;padding:6px 0;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px"><span class="sm" style="font-size:11px">Çar</span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 15zM9 18l-1 2M13 18l-1 2M17 18l-1 2"/></svg><span style="font-weight:500">7°</span></div>
    <div class="card" style="flex:1;padding:6px 0;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px"><span class="sm" style="font-size:11px">Per</span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 18z"/></svg><span style="font-weight:500">8°</span></div>
    <div class="card" style="flex:1;padding:6px 0;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px"><span class="sm" style="font-size:11px">Cum</span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg><span style="font-weight:500">6°</span></div>
    <div class="card" style="flex:1;padding:6px 0;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px"><span class="sm" style="font-size:11px">Cmt</span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 15zM9 18l-1 2M13 18l-1 2M17 18l-1 2"/></svg><span style="font-weight:500">8°</span></div>
  </div>
  <div style="padding:0 20px"><div class="card row" style="padding:10px 14px;gap:12px">
    <div style="flex:1"><p style="margin:0;font-size:14px;font-weight:500">9 parça · 5 look</p><p class="sm">Her parça en az 2 kez giyiliyor</p><label class="row" style="gap:8px;margin-top:6px;font-size:12.5px;min-height:28px;cursor:pointer"><input type="checkbox" style="width:18px;height:18px;accent-color:#1C1A17">Tek kabin bavulu</label></div>
    <svg role="img" aria-label="Hazırlık: 9 parçadan {{ done }} hazır" width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="28" r="23" fill="none" stroke="#E8E1D7" stroke-width="5"/><circle cx="28" cy="28" r="23" fill="none" stroke="#6E5640" stroke-width="5" stroke-linecap="round" stroke-dasharray="{{ dash }}" transform="rotate(-90 28 28)"/><text x="28" y="32" text-anchor="middle" font-family="Jost, sans-serif" font-size="12" font-weight="500" fill="#1C1A17">{{ done }}/9</text></svg>
  </div></div>
  <div class="card row" style="margin:0 20px;padding:10px 12px;gap:10px;border-color:#6E5640">
    <div class="ph" style="width:40px;height:44px;background:#3A342E;border-radius:8px;border:1.5px dashed #C9B49C;box-sizing:border-box"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4F1EC" stroke-width="1.1" stroke-linejoin="round" style="opacity:.6"><path d="M7 3h6v11l6 2v4H5V3z"/></svg></div>
    <div style="flex:1"><p class="eb" style="color:#6E5640">EKSİK PARÇA</p><p style="margin:2px 0 0;font-size:13.5px">Yağmur botu · 3 gün yağmur var</p></div>
  </div>
  <div class="scrollx" style="padding:0 20px;gap:8px" aria-label="Günlük looklar"><a href="DanismanSonuc.dc.html" class="ph" style="width:64px;height:72px;background:#3A342E;border-radius:10px"><span class="tag" style="left:4px;bottom:4px;font-size:8.5px;padding:2px 4px">SAL</span></a><a href="DanismanSonuc.dc.html" class="ph" style="width:64px;height:72px;background:#A89582;border-radius:10px"><span class="tag" style="left:4px;bottom:4px;font-size:8.5px;padding:2px 4px">ÇAR</span></a><a href="DanismanSonuc.dc.html" class="ph" style="width:64px;height:72px;background:#CDBFAE;border-radius:10px"><span class="tag" style="left:4px;bottom:4px;font-size:8.5px;padding:2px 4px">PER</span></a><a href="DanismanSonuc.dc.html" class="ph" style="width:64px;height:72px;background:#DDD3C6;border-radius:10px"><span class="tag" style="left:4px;bottom:4px;font-size:8.5px;padding:2px 4px">CUM</span></a><a href="DanismanSonuc.dc.html" class="ph" style="width:64px;height:72px;background:#BFAE99;border-radius:10px"><span class="tag" style="left:4px;bottom:4px;font-size:8.5px;padding:2px 4px">CMT</span></a></div>
  <div class="row" style="justify-content:space-between;padding:0 20px"><p class="h3">Bavul listesi</p><a href="KrediOnay.dc.html" class="row sm" style="gap:4px;color:#1C1A17;font-weight:500;min-height:44px"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="15" rx="6"/><path d="M12 18v3M8 21h8"/></svg>Lookları üzerimde gör</a></div>
  <div style="padding:0 20px;display:flex;flex-direction:column">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
      <label class="row" style="gap:12px;padding:8px 0;border-bottom:1px solid #DCD4C9;cursor:pointer;min-height:28px"><input type="checkbox" checked="{{ it.on }}" onChange="{{ it.toggle }}" style="width:20px;height:20px;accent-color:#1C1A17;margin:0"><span style="flex:1;font-size:14px;text-decoration:{{ it.deco }};color:{{ it.color }}">{{ it.name }}</span><span class="sm">{{ it.cat }}</span></label>
    </sc-for>
  </div>
</div>
<div class="bar">
  <div><p class="sm">1 eksik parça</p><p style="margin:2px 0 0;font-size:15px;font-weight:500">Bedeninde, bütçende</p></div>
  <a href="Magaza.dc.html" class="btn" style="flex:1">Eksikleri tamamla</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
  const data = [['Lacivert yün blazer', 'Dış giyim'], ['Siyah midi elbise', 'Elbise'], ['Beyaz poplin gömlek', 'Üst'], ['Düz jean', 'Alt']];
  const sel = (this.state && this.state.sel) || [0, 1, 2];
  const items = data.map(([name, cat], i) => {
    const on = sel.indexOf(i) >= 0;
    return { name, cat, on, deco: on ? 'line-through' : 'none', color: on ? '#665F56' : '#1C1A17',
      toggle: () => this.setState({ sel: on ? sel.filter((x) => x !== i) : sel.concat([i]) }) };
  });
  const done = sel.length;
  const c = 2 * Math.PI * 23;
  return { items, done, dash: (c * done / 9).toFixed(1) + ' ' + c.toFixed(1) };
}
}
</script>
</body>
