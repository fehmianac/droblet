      </div>
      <div class="row" style="gap:0"><button class="ib" aria-label="Kaydet" style="border:0"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v17l-6-4-6 4z"/></svg></button><button class="ib" aria-label="Paylaş" style="border:0" onClick="{{ openShare }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 8.5 12 4l4.5 4.5M5 14v6h14v-6"/></svg></button></div>

  </div>

<sc-if value="{{ share }}" hint-placeholder-val="{{ false }}">
  <button class="scrim" aria-label="Kapat" onClick="{{ closeShare }}"></button>
  <div class="sheet" style="padding:0 20px 34px;display:flex;flex-direction:column;gap:14px">
    <div class="grab"></div>
    <p class="h3" style="padding-top:4px">Look'u paylaş</p>
    <p class="sm">Link davet kodun ile paylaşılır; uygulama yüklü değilse mağazaya yönlendirir.</p>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
      <button class="card" style="height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:inherit;font-size:12.5px;color:#1C1A17;cursor:pointer" onClick="{{ closeShare }}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.3-4A8 8 0 1 1 8 19z"/></svg>WhatsApp</button>
      <button class="card" style="height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:inherit;font-size:12.5px;color:#1C1A17;cursor:pointer" onClick="{{ closeShare }}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M11 8h2.5a2.5 2.5 0 0 1 0 5H11M11 8l-2 12"/></svg>Pinterest</button>
      <button class="card" style="height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:inherit;font-size:12.5px;color:#1C1A17;cursor:pointer" onClick="{{ closeShare }}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Link kopyala</button>
    </div>
  </div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
  const s = this.state || {};
  const rating = s.rating != null ? s.rating : 4;
  const stars = [1, 2, 3, 4, 5].map((n) => ({
    label: n + ' yıldız', on: n <= rating,
    color: n <= rating ? '#6E5640' : '#8A8073',
    fill: n <= rating ? '#6E5640' : 'none',
    pick: () => this.setState({ rating: n })
  }));
  return { stars, share: !!s.share, openShare: () => this.setState({ share: true }), closeShare: () => this.setState({ share: false }) };
}
}
</script>
