<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>İlk 5 parça</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/e8430258669fc54f0b61d262bce30fdd">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Jost:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#1C1A17;text-decoration:none}a:hover{color:#6E5640}
</style>
</helmet>
<div class="scr">

<header class="row" style="height:48px;padding:0 20px;justify-content:space-between;position:relative;flex:none;margin-top:50px"><a href="OnbFoto.dc.html" class="ib" aria-label="Geri" style="border:0;width:44px;margin-left:-10px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><span class="sm" style="font-weight:500">3 / 3</span></header>
<div style="padding:0 24px;flex:none"><div style="height:3px;background:#1C1A17;border-radius:2px"></div></div>
<div style="padding:14px 20px 0;display:flex;flex-direction:column;gap:12px;flex:1;overflow:hidden">
  <div style="display:flex;flex-direction:column;gap:8px;padding:0 4px">
    <p class="eb">İLK 5 PARÇA</p>
    <h1 class="h1" style="font-size:29px">Gardırobunda bunlardan hangileri var?</h1>
    <p class="p">Dokunarak seç; fotoğraf gerekmez. İlk kombin önerin bu parçalarla hazırlanır.</p>
  </div>
  <a href="Ekle.dc.html" class="card row" style="gap:12px;padding:10px 14px;min-height:56px;box-sizing:border-box">
    <span class="ib" style="width:40px;height:40px;background:#1C1A17;border:0;color:#F4F1EC"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
    <span style="flex:1"><span style="display:block;font-size:14px;font-weight:500">Kendi parçanı çek</span><span class="sm">Kamera ile ekle, AI tanısın</span></span>
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </a>
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="9">
      <button aria-pressed="{{ it.on }}" onClick="{{ it.toggle }}" style="display:flex;flex-direction:column;gap:6px;background:transparent;border:0;padding:0;font-family:inherit;text-align:left;cursor:pointer;color:#1C1A17">
        <span class="ph" style="width:100%;height:80px;background:#E8E1D7;border-radius:12px;box-sizing:border-box;border:{{ it.ring }}"><svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#1C1A17" stroke-width="1.1" stroke-linejoin="round"><path d="{{ it.d }}"/></svg>
          <sc-if value="{{ it.on }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:11px;background:#1C1A17;color:#F4F1EC;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></sc-if>
        </span>
        <span style="font-size:12px;line-height:1.25">{{ it.label }}</span>
      </button>
    </sc-for>
  </div>
  <a href="Kutuphane.dc.html" class="sm" style="color:#1C1A17;font-weight:500;text-align:center;min-height:44px;display:flex;align-items:center;justify-content:center">Tüm hazır kütüphaneyi gör</a>
</div>
<div class="bar" style="position:relative">
  <div style="flex:1"><p style="margin:0;font-size:15px;font-weight:500">{{ count }} / 5 seçildi</p><p class="sm">En az 5 parça önerilir</p></div>
  <a href="Paywall.dc.html" class="btn" style="height:48px">Devam et</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
  const top = 'M8 3 3 6l2 4 3-1v12h8V9l3 1 2-4-5-3c-.5 1.5-2 2.5-4 2.5S8.5 4.5 8 3z';
  const outer = 'M8 3 4 6v15h6V9l2 3 2-3v12h6V6l-4-3-2 4z';
  const pants = 'M7 3h10l1 18h-5l-1-11-1 11H6z';
  const shoe = 'M3 16c0-2 .8-4.5 2-6.5l3 1c1 2 3 3 6 3l5 1c1.2.3 2 1.2 2 2.3V18H3z';
  const dress = 'M9 3h6l-1 5 4 13H6l4-13z';
  const bag = 'M5 9h14l-1 11H6zM9 9V7a3 3 0 0 1 6 0v2';
  const all = [
    ['Beyaz gömlek', top], ['Siyah blazer', outer], ['Mavi jean', pants],
    ['Siyah pantolon', pants], ['Bej trençkot', outer], ['Siyah elbise', dress],
    ['Beyaz sneaker', shoe], ['Siyah bot', shoe], ['Deri çanta', bag]
  ];
  const sel = (this.state && this.state.sel) || ['Beyaz gömlek', 'Mavi jean', 'Bej trençkot'];
  const items = all.map(([label, d]) => {
    const on = sel.indexOf(label) >= 0;
    return { label, d, on, ring: on ? '2px solid #1C1A17' : '2px solid transparent',
      toggle: () => this.setState({ sel: on ? sel.filter((x) => x !== label) : sel.concat([label]) }) };
  });
  return { items, count: sel.length };
}
}
</script>
</body>
</html>
